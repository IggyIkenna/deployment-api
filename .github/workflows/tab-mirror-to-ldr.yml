# tab-mirror-to-ldr.yml — BIDIRECTIONAL tab/** <-> live-defi-rollout mirror + divergence monitor
#
# Two legs (which one runs is decided by what triggered the workflow):
#
#   A. tab -> LDR  (push to a `tab/**` branch — the `mirror` job below). Lands agent work
#      committed on a tab branch onto LDR. Original behaviour; see decision table below.
#
#   B. LDR -> tab  (every-15-min schedule + manual dispatch — the `ldr_to_tabs` job). The
#      "keep-tabs-current-down" leg, added 2026-06-04
#      (qg_commit_quality_boundary_and_slot_ff_push_2026_06_03.md § "Remote tab branch
#      stays current with LDR"). NOT push-triggered: it runs on a `*/15 * * * *` cron and FFs
#      each behind tab only up to the latest LDR commit that is **older than 15 minutes** — a
#      "settle window" so freshly-landed LDR commits aren't propagated onto remote tabs until
#      they've stabilized (never races an in-flight host that's about to push to its own tab).
#      For EVERY `tab/*` branch:
#        - purely BEHIND LDR (ancestor)  -> FF the remote tab up to the >15-min-old LDR commit
#          (host-independent; covers headless/offline VMs the local slot-cron-ff-pull can't
#          reach). A tab already caught up to that aged commit (only behind by <15-min-old
#          commits) is left until those age in — deferred, not drift.
#        - purely AHEAD (own commits)    -> leave it; leg A lands it on the next tab push.
#        - DIVERGED (ahead AND behind)   -> never touched here -> ALERT (#ci-failures +
#          orchestrator). This is the divergence monitor escalation path
#          (cicd_contract_hardening_2026_06_01.md § "Tab-branch divergence detection").
#        - NAME COLLISION (generic `root`/`rootm` prefix = the $USER-on-VM collision class
#          fixed in setup-tab-worktrees.sh) -> ALERT. A tab branch name must be a global
#          key (one host fleet-wide); a generic prefix means >1 host can write it.
#      FF/alert-only — NEVER force-pushes a tab in leg B, NEVER auto-merges a divergence.
#      LDR->tab FF uses GITHUB_TOKEN so it does NOT recursively trigger leg A (GitHub
#      suppresses GITHUB_TOKEN-authored push events).
#
# ---- Leg A decision table (push to a tab branch) ----
# Triggered on every push to a `tab/<operator>/<slot>` branch. Lands the tab tip on
# `live-defi-rollout` (LDR):
#   - decision=ff      tab is a strict FF over LDR            → FF-push LDR directly.
#   - decision=rebase  tab DIVERGED from LDR (ahead AND behind — the FF-race-loss case
#                      on a hot integration branch)           → rebase the tab's commits
#                      onto current LDR, FF-push LDR, then realign the remote tab. Only
#                      a genuine textual CONFLICT aborts + surfaces (the sole thing that
#                      now blocks auto-landing). Added 2026-06-04 per the auto-rebasing
#                      mirror design (cicd_contract_hardening_2026_06_01.md).
#   - decision=behind  tab purely behind LDR (no unique commits) → nothing to mirror;
#                      the local slot-cron-ff-pull FFs the tab.
#   - decision=noop    tab tip == LDR tip                     → nothing to do.
#
# WHY the rebase is safe (the reason the mirror could previously only FF-or-skip):
#   1. A no-conflict rebase is content-clean; a real conflict aborts + is surfaced.
#   2. The tab force-push uses GITHUB_TOKEN, so it does NOT recursively re-trigger this
#      workflow (GitHub suppresses GITHUB_TOKEN-authored push events) — no loop.
#   3. `--force-with-lease=<branch>:<orig-sha>` refuses if a concurrent agent pushed to
#      this tab since checkout, so live work on the tab is never clobbered.
#   4. The local worktree adopts the rewritten tab via the cron's `[adopt-rebase]` path
#      (slot-cron-ff-pull.sh) — clean-gated, and ONLY when every ahead-commit is already
#      patch-id-present in LDR (exactly the commits this workflow rebased), so genuine
#      in-flight work and dirty WIP are never auto-rewritten.
#
# Per-side / per-slot push semantics:
#   - Tab branch always advances first (the push that triggers this).
#   - LDR advances iff the tab tip is (or is rebased to) a strict FF over LDR HEAD.
#   - A genuine same-file conflict between tab and LDR halts as `[mirror:conflict]` and
#     requires the local `git rebase origin/live-defi-rollout` recovery.
#
# Concurrency: `cancel-in-progress: false` with a destination-keyed group so two mirror
# attempts serialize (avoids two runs both passing the check then racing the push).
#
# Rollout: `bash unified-trading-pm/scripts/workflow-templates/rollout-workflow-templates.sh --template tab-mirror-to-ldr.yml`
#
# SSOT: this file lives canonically in unified-trading-pm/scripts/workflow-templates/.
# Per-repo copies are flat duplicates; never edit the per-repo copy.

name: tab-mirror-to-ldr

on:
  push:
    branches:
      - "tab/**" # leg A: tab -> LDR (land agent work promptly — stays push-triggered)
  schedule:
    - cron: "*/15 * * * *" # leg B: every 15 min, FF behind tabs to the LDR commit that's >15 min old
  workflow_dispatch: {} # manual leg-B sweep

concurrency:
  # Serialize all mirror activity per repo (both legs) so two runs never race a push.
  group: tab-mirror-to-ldr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    # Leg A only — push to a tab/** branch. Never runs for the LDR/schedule/dispatch triggers.
    if: startsWith(github.ref, 'refs/heads/tab/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pushed tab branch (full history needed for FF/rebase)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute mirror decision
        id: ff_check
        run: |
          set -euo pipefail
          git fetch origin live-defi-rollout
          tab_sha="$(git rev-parse HEAD)"
          ldr_sha="$(git rev-parse origin/live-defi-rollout)"
          if [ "$tab_sha" = "$ldr_sha" ]; then
            echo "decision=noop" >> "$GITHUB_OUTPUT"
            echo "reason=tab tip == LDR tip (no-op)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          merge_base="$(git merge-base HEAD origin/live-defi-rollout)"
          if [ "$merge_base" = "$ldr_sha" ]; then
            echo "decision=ff" >> "$GITHUB_OUTPUT"
            echo "reason=tab is strict FF over LDR" >> "$GITHUB_OUTPUT"
          elif [ "$merge_base" = "$tab_sha" ]; then
            echo "decision=behind" >> "$GITHUB_OUTPUT"
            echo "reason=LDR is ahead of tab; nothing to mirror (local cron FFs tab)" >> "$GITHUB_OUTPUT"
          else
            echo "decision=rebase" >> "$GITHUB_OUTPUT"
            echo "reason=tab diverged from LDR (ahead AND behind) — rebase onto LDR + mirror" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast-forward LDR to tab tip
        if: steps.ff_check.outputs.decision == 'ff'
        run: |
          set -euo pipefail
          echo "[mirror] ${GITHUB_REF} -> live-defi-rollout (${{ steps.ff_check.outputs.reason }})"
          # Default `git push` (no --force) is FF-only on the destination ref.
          if git push origin "HEAD:live-defi-rollout" 2>&1 | tee /tmp/push.log; then
            echo "[mirror:done] LDR advanced to $(git rev-parse HEAD | head -c 8)"
          else
            echo "[mirror:race-lost] another push beat us; LDR is now ahead of this tab tip"
            grep -q "non-fast-forward\|rejected" /tmp/push.log && exit 0
            cat /tmp/push.log
            exit 1
          fi

      - name: Rebase onto LDR + mirror (diverged tab)
        id: rebase
        if: steps.ff_check.outputs.decision == 'rebase'
        run: |
          set -uo pipefail   # NOT -e: rebase/push failures are handled explicitly
          orig_sha="$(git rev-parse HEAD)"      # lease anchor: only realign tab if remote still here
          git config user.name "tab-mirror[bot]"
          git config user.email "ikennaigboaka@gmail.com"
          landed=0
          for attempt in 1 2 3; do
            git fetch -q origin live-defi-rollout
            if ! git rebase origin/live-defi-rollout >/tmp/rb.log 2>&1; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "[mirror:conflict] real rebase conflict (attempt ${attempt}) — manual 'git rebase origin/live-defi-rollout' required"
              tail -20 /tmp/rb.log 2>/dev/null || true
              echo "outcome=conflict" >> "$GITHUB_OUTPUT"
              exit 0   # expected outcome — the orchestrator surfaces it via the webhook
            fi
            if git push origin "HEAD:live-defi-rollout" 2>/tmp/ldr.log; then
              landed=1; break
            fi
            if ! grep -qE "non-fast-forward|rejected|fetch first|stale info" /tmp/ldr.log; then
              echo "[mirror:error] unexpected LDR push failure:"; cat /tmp/ldr.log; exit 1
            fi
            echo "[mirror:race] LDR moved during attempt ${attempt}; re-rebasing onto the new tip"
          done
          # Realign the remote tab to the rebased history so the local worktree can adopt
          # it cleanly. GITHUB_TOKEN push => no recursive trigger. The lease (orig_sha)
          # refuses if a concurrent agent pushed to this tab since checkout.
          if git push "--force-with-lease=${GITHUB_REF_NAME}:${orig_sha}" origin "HEAD:${GITHUB_REF_NAME}" 2>/tmp/tab.log; then
            echo "[mirror:tab-realigned] origin/${GITHUB_REF_NAME} rebased onto LDR"
          else
            echo "[mirror:tab-realign-skipped] lease refused — concurrent push to this tab; leaving remote tab unchanged"
            cat /tmp/tab.log 2>/dev/null || true
          fi
          if [ "${landed}" -eq 1 ]; then
            echo "[mirror:rebased+landed] LDR advanced to $(git rev-parse HEAD | head -c 8) + tab realigned"
            echo "outcome=rebased+landed" >> "$GITHUB_OUTPUT"
          else
            echo "[mirror:race-exhausted] LDR too hot across 3 attempts; tab realigned onto latest LDR (clean FF) — next push/mirror lands it"
            echo "outcome=race-exhausted" >> "$GITHUB_OUTPUT"
          fi

      - name: Log no-op / behind
        if: steps.ff_check.outputs.decision == 'noop' || steps.ff_check.outputs.decision == 'behind'
        run: |
          echo "[mirror:skip] ${GITHUB_REF} -> live-defi-rollout : ${{ steps.ff_check.outputs.reason }}"
          echo "decision: ${{ steps.ff_check.outputs.decision }}"

      - name: Notify orchestrator (mirror event webhook)
        if: always() # fire on success AND skip AND conflict — orchestrator decides what to surface
        env:
          ORCHESTRATOR_URL: https://api.agent-orchestrator.odum-research.com
          DECISION: ${{ steps.ff_check.outputs.decision }}
          REASON: ${{ steps.ff_check.outputs.reason }}
          REBASE_OUTCOME: ${{ steps.rebase.outputs.outcome }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Best-effort webhook: never red-fail the workflow on notifier issues.
          # The orchestrator persists every event (ff/noop/behind/rebased/conflict) so the
          # dashboard can surface alerts for conflict/race-exhausted and a heartbeat for the
          # rest. Added 2026-05-20 per
          # plans/active/agent_reliability_mitigations_2026_05_20.md Phase 1.
          set +e
          SHA="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          PAYLOAD=$(cat <<EOF
          {
            "repo": "${REPO}",
            "branch": "${BRANCH}",
            "sha": "${SHA}",
            "decision": "${DECISION:-unknown}",
            "reason": "${REASON:-no reason recorded}${REBASE_OUTCOME:+ (${REBASE_OUTCOME})}",
            "workflow_run_url": "${RUN_URL}"
          }
          EOF
          )
          HTTP_CODE=$(curl -sS -o /tmp/notify.body -w "%{http_code}" \
            -X POST "${ORCHESTRATOR_URL}/api/mirror-events" \
            -H "Content-Type: application/json" \
            --connect-timeout 5 --max-time 15 \
            -d "${PAYLOAD}" || echo "000")
          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ]; then
            echo "[mirror-notify] ok (${HTTP_CODE}): $(cat /tmp/notify.body 2>/dev/null | head -c 200)"
          else
            echo "[mirror-notify] non-2xx (${HTTP_CODE}) — best-effort, ignoring"
            cat /tmp/notify.body 2>/dev/null | head -c 200 || true
          fi
          exit 0

  ldr_to_tabs:
    # Leg B — runs every 15 min (schedule) or on manual dispatch. FFs every behind-only tab up
    # to the latest LDR commit OLDER THAN 15 MIN (settle window — never propagates a just-landed
    # commit onto remote tabs); alerts on diverged tabs + name collisions. FF/alert-only — never
    # force-pushes a tab, never auto-merges a divergence.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout LDR (full history; tab refs fetched below)
        uses: actions/checkout@v4
        with:
          ref: live-defi-rollout
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: FF behind-only tabs + classify diverged / collisions
        id: sweep
        run: |
          set -uo pipefail
          git config user.name "tab-mirror[bot]"
          git config user.email "ikennaigboaka@gmail.com"

          # --- Active-host filter (operator-maintained SSOT). A diverged tab whose prefix is ACTIVE
          #     alerts LOUDLY (:rotating_light: #ci-failures, every 15 min) — a host that is up and
          #     able to act must be loud. A diverged tab on a NON-active prefix (a parked/dormant epic
          #     VM, the other operator's offline laptop, a decommissioned root VM, an orphan prefix)
          #     is NOT spammed: silent if it carries no genuinely-unmerged work, or surfaced ONCE/day
          #     in a low-severity "stranded work on dormant host" digest if it does (so stranded
          #     commits aren't lost, just not spammed). This is the registry filter that stops
          #     dormant-host alert spam.
          #
          #     POLICY (operator 2026-06-05): loud = (a) the OPERATOR LAPTOPS — Ikenna (`ikennaigboaka`)
          #     + Harsh (`hk`, the canonical Harsh-laptop prefix — NOT `hkm`, and NOT `harsh` which is
          #     Harsh's separate AWS VM) + (b) the always-on CENTRAL API / PLANNING VM = prefix `planning`
          #     (EC2 i-0c9b283b…, Elastic IP 13.113.200.22, api.agent-orchestrator.odum-research.com). THAT
          #     box is the single API that actions CI escalations (nginx :443 → orchestrator backend :8765;
          #     POST /api/escalate lands there) AND hosts the interactive planning slots. `vm-orchestrator`
          #     is NOT it — that's a separate, currently-STOPPED *epic* VM (owns the agent-orchestrator
          #     codebase epic), so it's parked like every epic VM. The earlier note here that called
          #     vm-orchestrator the escalation sink was WRONG (topology reconciled
          #     planning_vm_canonical_bringup_and_topology_reconcile_2026_06_05.md).
          #     NAMING: a VM brands its tab branches by its ROLE/VM-id (`planning`, `vm-defi`, …), NEVER by
          #     a human operator's name — the planning VM was mis-provisioned as `--operator ikenna` →
          #     `tab/ikenna/<N>` (collided with Ikenna's laptop); it is now `planning`
          #     (ORCHESTRATOR_VM_ID=planning → tab/planning/<N>).
          #     Everything else is parked by default — we are NOT always running a host per epic, so
          #     listing every epic VM here would re-spam the moment one is down. To mark an epic VM up
          #     while it runs, edit ACTIVE_PREFIX_BASES + roll out (rollout-workflow-templates.sh).
          #     `is_active` also matches the `<base>m` main-role form (so `hk` covers `hkm`, `planning`
          #     covers `planningm`). Suppressed by construction: `vm-orchestrator` + all parked epic VMs,
          #     `harsh` (Harsh's parked AWS VM), root/rootm (the $USER-on-VM collision class), any
          #     unregistered prefix.
          ACTIVE_PREFIX_BASES="ikennaigboaka hk planning"
          is_active() {
            local p="$1" b
            for b in $ACTIVE_PREFIX_BASES; do
              [ "$p" = "$b" ] && return 0
              [ "$p" = "${b}m" ] && return 0     # main-role form (tab/<base>m/<N>)
            done
            return 1
          }
          # checkout fetched LDR only; pull in every remote tab/* ref for the sweep.
          git fetch --prune origin '+refs/heads/tab/*:refs/remotes/origin/tab/*' >/dev/null 2>&1 || true
          git fetch -q origin live-defi-rollout
          ldr="$(git rev-parse origin/live-defi-rollout)"
          # Settle window: FF tabs only up to the latest LDR commit older than 15 min, so a
          # just-landed commit isn't propagated onto remote tabs until it stabilizes. Empty if
          # EVERY LDR commit is <15 min old (very fresh history) -> defer all FF this tick.
          ff_target="$(git rev-list -1 --before='15 minutes ago' origin/live-defi-rollout 2>/dev/null || true)"
          echo "[ldr->tab] LDR tip=${ldr:0:8}; 15-min-settled FF target=${ff_target:0:8}"

          ff_n=0; defer_n=0; div_n=0; col_n=0; stranded_n=0
          : > /tmp/ffed.txt; : > /tmp/diverged.txt; : > /tmp/collisions.txt; : > /tmp/stranded.txt
          declare -A div_hosts; declare -A stranded_hosts

          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/tab); do
            br="${ref#origin/}"                          # tab/<prefix>/<N>
            [ "${br#tab/}" = "$br" ] && continue         # safety: only tab/* names
            tip="$(git rev-parse "$ref")"
            prefix="${br#tab/}"; prefix="${prefix%/*}"    # tab/<prefix>/<N> -> <prefix>

            # Name-collision class: generic $USER-on-VM prefix (fixed in setup-tab-worktrees.sh).
            # Only LOUD-alert a collision on an ACTIVE prefix (a real, current problem). A root/rootm
            # collision is a known dormant-host artifact → it flows through the diverged/stranded
            # routing below instead of spamming the collision alert every 15 min.
            case "$prefix" in
              root|rootm)
                if is_active "$prefix"; then
                  printf '• `%s` (generic prefix `%s` — >1 host can write this name)\n' "$br" "$prefix" >> /tmp/collisions.txt
                  col_n=$((col_n+1))
                fi ;;
            esac

            [ "$tip" = "$ldr" ] && continue              # already current

            if git merge-base --is-ancestor "$tip" "$ldr"; then
              # behind-only vs LDR tip. FF only up to the 15-min-settled target, so a just-landed
              # commit isn't pushed onto the tab yet. Default push is FF-only; GITHUB_TOKEN
              # authorship suppresses a recursive leg-A trigger.
              if [ -n "$ff_target" ] && [ "$tip" != "$ff_target" ] && git merge-base --is-ancestor "$tip" "$ff_target"; then
                if git push origin "${ff_target}:refs/heads/${br}" >/tmp/ff.log 2>&1; then
                  behind="$(git rev-list --count "${tip}..${ff_target}")"
                  printf '• `%s` (+%s -> settled %s)\n' "$br" "$behind" "${ff_target:0:8}" >> /tmp/ffed.txt
                  ff_n=$((ff_n+1))
                else
                  echo "[ldr->tab] FF push FAILED for ${br}:"; cat /tmp/ff.log
                fi
              else
                # behind only by commits <15 min old (or no aged target this tick) — defer to settle
                defer_n=$((defer_n+1))
              fi
            elif git merge-base --is-ancestor "$ldr" "$tip"; then
              :                                          # ahead-only (own commits) — leg A lands it; benign
            else
              ab="$(git rev-list --left-right --count "${ldr}...${tip}")"   # "<behind>\t<ahead>" rel. LDR
              behind="$(printf '%s' "$ab" | cut -f1)"
              ahead="$(printf '%s' "$ab" | cut -f2)"
              if is_active "$prefix"; then
                # ACTIVE host diverged → loud alert (a live host going sideways jams the mirror).
                printf '• `%s` (ahead %s, behind %s; tip %s, prefix `%s`)\n' "$br" "$ahead" "$behind" "${tip:0:8}" "$prefix" >> /tmp/diverged.txt
                div_n=$((div_n+1)); div_hosts["$prefix"]=1
              else
                # DORMANT/unknown host diverged → do NOT spam. Only surface (once/day, low severity)
                # if it carries genuinely-unmerged commits (cherry '+'), so stranded work isn't lost;
                # a pure patch-id-duplicate divergence (0 unmerged) is a benign stale pointer → silent.
                unmerged="$(git cherry "$ldr" "$ref" 2>/dev/null | grep -c '^+')"
                if [ "${unmerged:-0}" -gt 0 ]; then
                  printf '• `%s` (%s unmerged commit(s); ahead %s, behind %s; tip %s)\n' "$br" "$unmerged" "$ahead" "$behind" "${tip:0:8}" >> /tmp/stranded.txt
                  stranded_n=$((stranded_n+1)); stranded_hosts["$prefix"]=1
                fi
              fi
            fi
          done

          # NOTE: ${#assoc[@]} on an EMPTY `declare -A` array still trips `set -u`
          # ("unbound variable") on the runner's bash when a tick has no active-diverged /
          # stranded hosts — which crashed the whole mirror (exit 1, no FF) every tick that
          # found nothing wrong. Count into plain ints with nounset OFF so the empty case is 0.
          set +u
          div_hosts_n="${#div_hosts[@]}"
          stranded_hosts_n="${#stranded_hosts[@]}"
          set -u
          {
            echo "ff_n=${ff_n}"
            echo "defer_n=${defer_n}"
            echo "div_n=${div_n}"
            echo "col_n=${col_n}"
            echo "div_hosts=${div_hosts_n}"
            echo "stranded_n=${stranded_n}"
            echo "stranded_hosts=${stranded_hosts_n}"
          } >> "$GITHUB_OUTPUT"
          echo "[ldr->tab] FF'd ${ff_n} tab(s) to settled target; deferred ${defer_n} (<15-min-fresh); ${div_n} diverged (active) across ${div_hosts_n} host(s); ${col_n} name-collision(s); ${stranded_n} stranded-on-dormant across ${stranded_hosts_n} host(s) (suppressed from loud alert)"

      - name: Alert on divergence / collisions (#ci-failures + orchestrator)
        if: always() && (steps.sweep.outputs.div_n != '0' || steps.sweep.outputs.col_n != '0')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          ORCHESTRATOR_URL: https://api.agent-orchestrator.odum-research.com
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIV_N: ${{ steps.sweep.outputs.div_n }}
          DIV_HOSTS: ${{ steps.sweep.outputs.div_hosts }}
          COL_N: ${{ steps.sweep.outputs.col_n }}
        run: |
          set +e   # alerting is BEST-EFFORT — never red-fail the sweep on a notifier issue
          HEADER=":rotating_light: *tab-branch drift* in \`${REPO}\` — ${DIV_N} diverged across ${DIV_HOSTS} host(s), ${COL_N} name-collision(s)"
          BODY=""
          if [ "${DIV_N}" != "0" ]; then
            BODY="${BODY}*Diverged* (own commits AND behind LDR — jams the tab→LDR mirror; fix on the owning host: \`git rebase origin/live-defi-rollout\`):"$'\n'"$(cat /tmp/diverged.txt 2>/dev/null)"$'\n'
          fi
          if [ "${COL_N}" != "0" ]; then
            BODY="${BODY}*Name collisions* (re-provision with VM_NAME set: \`setup-tab-worktrees.sh --reset-slot N\`):"$'\n'"$(cat /tmp/collisions.txt 2>/dev/null)"$'\n'
          fi
          BODY="${BODY}<${RUN_URL}|sweep run>"

          case "${SLACK_WEBHOOK_URL:-}" in
            https://*)
              HEADER="$HEADER" BODY="$BODY" python3 - <<PYEOF
          import json, os, urllib.request
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps({"text": os.environ["HEADER"], "blocks": [
                  {"type": "section", "text": {"type": "mrkdwn", "text": os.environ["HEADER"]}},
                  {"type": "section", "text": {"type": "mrkdwn", "text": os.environ["BODY"]}},
              ]}).encode(),
              headers={"Content-Type": "application/json"}, method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print(f"[alert] posted to #ci-failures (HTTP {r.status})")
          except Exception as e:
              print(f"[alert] slack post failed (best-effort): {e}")
          PYEOF
              ;;
            *) echo "[alert] no https Slack webhook — skipping (best-effort)" ;;
          esac

          # Best-effort orchestrator surface (same sink as mirror-events; never red-fails).
          curl -sS -o /dev/null -X POST "${ORCHESTRATOR_URL}/api/mirror-events" \
            -H "Content-Type: application/json" --connect-timeout 5 --max-time 15 \
            -d "{\"repo\":\"${REPO}\",\"branch\":\"(fleet-sweep)\",\"decision\":\"diverged\",\"reason\":\"${DIV_N} diverged / ${COL_N} collisions\",\"workflow_run_url\":\"${RUN_URL}\"}" \
            >/dev/null 2>&1 || true
          exit 0

      - name: Stranded-work digest (dormant hosts — low severity, ONCE/day)
        # Diverged tabs on NON-active prefixes that carry genuinely-unmerged commits are suppressed
        # from the 15-min loud alert (above) so a parked/decommissioned host doesn't spam. Instead we
        # surface them in a quiet digest ONCE/day — the 06:00-06:14 UTC tick — so stranded commits are
        # visible to the owner without 96 pages/day. GHA is stateless, so the daily window is the
        # practical "once". Best-effort; never red-fails the sweep.
        if: always() && steps.sweep.outputs.stranded_n != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STRANDED_N: ${{ steps.sweep.outputs.stranded_n }}
          STRANDED_HOSTS: ${{ steps.sweep.outputs.stranded_hosts }}
        run: |
          set +e
          # Daily gate: only emit in the first 15-min window of 06:00 UTC (one sweep tick/day).
          hh="$(date -u +%H)"; mm="$(date -u +%M)"
          if [ "$hh" != "06" ] || [ "$mm" -ge 15 ]; then
            echo "[stranded-digest] ${STRANDED_N} stranded branch(es) on dormant host(s) — holding until the 06:00 UTC daily digest (now ${hh}:${mm} UTC)."
            exit 0
          fi
          HEADER=":information_source: *stranded work on dormant hosts* in \`${REPO}\` — ${STRANDED_N} branch(es) across ${STRANDED_HOSTS} dormant/parked host(s)"
          BODY="These diverged tabs are on NON-active prefixes (parked/decommissioned hosts) so they're suppressed from the 15-min drift alert, but they carry unmerged commits. Rescue on the owning host (\`git rebase origin/live-defi-rollout\`) or delete if obsolete:"$'\n'"$(cat /tmp/stranded.txt 2>/dev/null)"$'\n'"<${RUN_URL}|sweep run>"
          case "${SLACK_WEBHOOK_URL:-}" in
            https://*)
              HEADER="$HEADER" BODY="$BODY" python3 - <<PYEOF
          import json, os, urllib.request
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps({"text": os.environ["HEADER"], "blocks": [
                  {"type": "section", "text": {"type": "mrkdwn", "text": os.environ["HEADER"]}},
                  {"type": "section", "text": {"type": "mrkdwn", "text": os.environ["BODY"]}},
              ]}).encode(),
              headers={"Content-Type": "application/json"}, method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print(f"[stranded-digest] posted (HTTP {r.status})")
          except Exception as e:
              print(f"[stranded-digest] slack post failed (best-effort): {e}")
          PYEOF
              ;;
            *) echo "[stranded-digest] no https Slack webhook — skipping (best-effort)" ;;
          esac
          exit 0
