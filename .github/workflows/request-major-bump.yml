name: request-major-bump

# Thin caller stub (fleet_workflow_template_dedup_to_unified_trading_ci_2026_08_06.md
# todo 4) -- the actual logic now lives in unified-trading-ci as a workflow_call
# reusable workflow. Local trigger config is unavoidable (GitHub Actions requires a
# physical file per repo to declare it), but no job logic lives here anymore.
#
# Do NOT hand-edit the logic here — edit
# unified-trading-ci/.github/workflows/request-major-bump.yml and every caller picks it up
# automatically on the next run (pinned @main).

on:
  workflow_dispatch:
    inputs:
      proposed_version:
        description: "New MAJOR version (e.g. 1.0.0 or 2.0.0)"
        required: true
        type: string
      reason:
        description: "Why this is a MAJOR bump (e.g. removed /v1/orders endpoint)"
        required: true
        type: string
      approver:
        description: "GitHub handle of requester (defaults to actor)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  request-major-bump:
    uses: IggyIkenna/unified-trading-ci/.github/workflows/request-major-bump.yml@main
    with:
      proposed_version: ${{ inputs.proposed_version }}
      reason: ${{ inputs.reason }}
      approver: ${{ inputs.approver }}
    secrets: inherit
