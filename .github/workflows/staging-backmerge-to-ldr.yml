# staging-backmerge-to-ldr.yml — auto back-merge `staging` → live-defi-rollout
#
# Triggered on every push to `staging`. Brings staging-only commits (the SIT
# debounce merges, semver bumps that land on staging, any staging-direct fix)
# back into the integration branch `live-defi-rollout` so the two never drift
# apart. This is the staging-axis sibling of main-backmerge-to-ldr.yml — that one
# closes main↔LDR drift, this one closes staging↔LDR drift (the gap surfaced by
# the flow-health reporter: staging↔LDR drift was previously invisible).
#
# SAFETY CONTRACT (identical to main-backmerge-to-ldr.yml):
#   - NEVER force-pushes. Only `git merge --no-ff` (additive) then an FF-only push
#     to LDR. It can never overwrite or rewrite a developer's LDR work.
#   - CLEAN merge → silently merge-pushes into LDR (no PR noise).
#   - CONFLICT    → does NOTHING destructive. Opens (or refreshes) a visible
#     `staging → live-defi-rollout` PR for a human + escalates to the
#     orchestrator. NEVER auto-resolves a conflict.
#   - RACE (LDR moved mid-merge) → retries FF-only up to 5×; never clobbers.
#   - Only fires for repos that HAVE a staging branch (main-only repos no-op).
#
# Concurrency: keyed on the destination ref so simultaneous back-merges serialize
# (shared with main-backmerge so the two never race the same LDR push).
#
# Rollout: `bash unified-trading-pm/scripts/workflow-templates/rollout-workflow-templates.sh --template staging-backmerge-to-ldr.yml`
#
# SSOT: this file lives canonically in unified-trading-pm/scripts/workflow-templates/.
# Per-repo copies are flat duplicates; never edit the per-repo copy.

name: staging-backmerge-to-ldr

on:
  push:
    branches:
      - staging

concurrency:
  group: backmerge-to-ldr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  backmerge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout (full history needed for merge + relationship check)
        uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Back-merge staging into LDR (merge-only; conflict → visible PR; never force)
        id: bm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -uo pipefail

          # LDR must exist (some repos are main-only; nothing to back-merge then).
          if ! git ls-remote --exit-code --heads origin live-defi-rollout >/dev/null 2>&1; then
            echo "decision=noop" >> "$GITHUB_OUTPUT"
            echo "reason=no live-defi-rollout branch in this repo" >> "$GITHUB_OUTPUT"
            echo "[backmerge:noop] no LDR branch — nothing to do"
            exit 0
          fi

          git fetch origin staging live-defi-rollout --quiet

          # If LDR already contains everything on staging, this is a no-op.
          if [ "$(git rev-list origin/live-defi-rollout..origin/staging --count)" = "0" ]; then
            echo "decision=noop" >> "$GITHUB_OUTPUT"
            echo "reason=staging already contained in LDR" >> "$GITHUB_OUTPUT"
            echo "[backmerge:noop] LDR already contains staging HEAD"
            exit 0
          fi

          git config user.name "uts-backmerge-bot"
          git config user.email "uts-backmerge-bot@users.noreply.github.com"

          DECISION="race"
          REASON="LDR kept advancing; exhausted retries"
          for attempt in 1 2 3 4 5; do
            git fetch origin live-defi-rollout --quiet
            git checkout -B _backmerge origin/live-defi-rollout --quiet

            # Additive merge. --no-ff keeps a clear back-merge commit in history.
            if ! git merge --no-ff --no-edit origin/staging; then
              # NEVER auto-resolve a staging→LDR conflict. (Unlike main, staging is
              # not the authoritative ci_status home — main is — so there is no
              # safe ci_status-only auto-resolve here.) Surface it for a human.
              git merge --abort || true
              DECISION="conflict"
              REASON="staging and LDR conflict — human resolution required (no auto-resolve)"
              break
            fi

            # FF-only push (default push is non-destructive on the destination ref).
            if git push origin "HEAD:live-defi-rollout" 2>&1 | tee /tmp/push.log; then
              DECISION="merged"
              REASON="staging back-merged into LDR (attempt ${attempt})"
              break
            else
              if grep -q "non-fast-forward\|rejected" /tmp/push.log; then
                echo "[backmerge:race] LDR advanced during merge — retrying (attempt ${attempt})"
                continue
              fi
              # A real push error (auth/etc) — surface it.
              DECISION="error"
              REASON="push failed for a non-race reason (see log)"
              cat /tmp/push.log
              break
            fi
          done

          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "[backmerge:${DECISION}] ${REASON}"

          # On conflict, ensure a VISIBLE staging→LDR PR exists for a human to
          # resolve. Never auto-resolve.
          if [ "${DECISION}" = "conflict" ]; then
            EXISTING=$(gh pr list --base live-defi-rollout --head staging --state open --json number -q '.[0].number' 2>/dev/null || echo "")
            if [ -z "${EXISTING}" ]; then
              gh pr create --base live-defi-rollout --head staging \
                --title "[backmerge] staging → live-defi-rollout (CONFLICT — needs resolution)" \
                --body "Auto-opened by staging-backmerge-to-ldr because staging has commit(s) that conflict with LDR. Resolve to keep staging and the integration branch from drifting. Do NOT force-push LDR." \
                2>/dev/null && echo "[backmerge] opened conflict PR" || echo "[backmerge] could not open PR (may already exist / perms)"
            else
              echo "[backmerge] conflict PR #${EXISTING} already open"
            fi
            # ALSO escalate to the orchestrator so the conflict is actively resolved on
            # live-defi-rollout, not just parked in a human PR — "every alert → orchestrator".
            # Fired with GH_PAT: a repository_dispatch from GITHUB_TOKEN does NOT trigger workflows.
            REPO_NAME="${GITHUB_REPOSITORY##*/}"
            CONFLICT_PR="$(gh pr list --base live-defi-rollout --head staging --state open --json number -q '.[0].number' 2>/dev/null || echo 0)"
            GH_TOKEN="${GH_PAT:-}" gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
              -f event_type=escalate-to-orchestrator \
              -f "client_payload[repo]=${REPO_NAME}" \
              -f "client_payload[pr_number]=${CONFLICT_PR:-0}" \
              -f 'client_payload[wall_type]=merge_conflict' \
              -f "client_payload[context]=staging->live-defi-rollout back-merge conflict: ${REASON}. Resolve on live-defi-rollout (never force-push); quality-gates-v2 re-gates." \
              -f 'client_payload[model]=opus' \
              >/dev/null 2>&1 && echo "[backmerge] escalated conflict to orchestrator (opus worker)" \
              || echo "[backmerge] orchestrator escalation dispatch failed (best-effort; human PR still open)"
          fi

          # A real error (not conflict/race/noop/merged) is the only red-fail case.
          if [ "${DECISION}" = "error" ]; then
            exit 1
          fi
          exit 0

      - name: Notify orchestrator (best-effort; fires on every decision)
        if: always()
        env:
          ORCHESTRATOR_URL: https://api.agent-orchestrator.odum-research.com
          DECISION: ${{ steps.bm.outputs.decision }}
          REASON: ${{ steps.bm.outputs.reason }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          SHA="$(git rev-parse origin/staging 2>/dev/null || echo unknown)"
          PAYLOAD=$(cat <<EOF
          {
            "repo": "${REPO}",
            "branch": "staging",
            "sha": "${SHA}",
            "decision": "${DECISION:-unknown}",
            "reason": "${REASON:-no reason recorded}",
            "workflow_run_url": "${RUN_URL}",
            "kind": "staging-backmerge-to-ldr"
          }
          EOF
          )
          HTTP_CODE=$(curl -sS -o /tmp/notify.body -w "%{http_code}" \
            -X POST "${ORCHESTRATOR_URL}/api/mirror-events" \
            -H "Content-Type: application/json" \
            --connect-timeout 5 --max-time 15 \
            -d "${PAYLOAD}" || echo "000")
          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ]; then
            echo "[backmerge-notify] ok (${HTTP_CODE})"
          else
            echo "[backmerge-notify] non-2xx (${HTTP_CODE}) — best-effort, ignoring"
          fi
          exit 0
