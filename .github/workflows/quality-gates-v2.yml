# quality-gates-v2.yml — UNIFIED quality-gates workflow template (v2, escapes GHA ghost cache)
#
# CANONICAL SOURCE. Do NOT hand-edit per-repo copies — edit THIS template and run
#   bash unified-trading-pm/scripts/workflow-templates/rollout-workflow-templates.sh
# The hand-copied v2 workflows that predated this template carried a stale job
# `name:` (every copy said `Quality Gates (alerting-service)` regardless of repo),
# which broke the ruleset required-check derivation in
# `scripts/repo-management/pin_branch_protection_rulesets.py` (the required context
# is `<job name:> / quality-gates-v2`, so a wrong name = a context the run never
# emits = a permanently-red required check). This template renders the correct
# per-repo `name:` + the full **transitive editable dependency closure** so CI
# clones every `path = "../<repo>"` sibling `uv sync` needs (an incomplete
# `dep_repos` is the other historical break — e.g. system-integration-tests failing
# on `metadata for alerting-service==0.1.0 @ editable+../alerting-service`).
#
# DESIGN: v2 replacement for workspace-qg.yml. The v1 chain had GitHub cache a
# BuildFailed state for check context "quality-gates"; calling
# python-quality-gates-v2.yml (job key "quality-gates-v2") registers a fresh check
# context that bypasses the ghost cache (Option D).
#
# ## Trigger surface:
#   push to [main] + pull_request to [main, staging] + workflow_dispatch
#   (live-defi-rollout never triggers — no remote CI on the gateless trunk;
#    push:[staging] dropped 2026-06-10 A3 — staging-green inherits from the LDR→staging PR's v2)
#
# ## Substitution placeholders (rendered by rollout-workflow-templates.sh):
#   - unified-trading-library unified-api-contracts deployment-service   — transitive editable closure from the repo's pyproject
#                       `path = "../<repo>"` deps (manifest fallback if no pyproject)
#   - deployment-api   — repo name (e.g. alerting-service)
#   - deployment_api  — Python source dir (e.g. alerting_service) [reserved; derived
#                       inside the reusable workflow today]

name: quality-gates-v2

on:
  # A3 (ldr_trunk_promotion_decoupling_2026_06_10): NO QG on push:[staging]. The LDR→staging promote
  # PR's v2 (pull_request below, head=LDR base=staging) runs on the exact tree that lands on staging
  # and IS the staging gate; STAGING_GREEN inherits from that PR's pass (A1), so a second
  # push:[staging] run is redundant. push:[main] stays (records MAIN_GREEN post-merge);
  # pull_request:[main,staging] stays (the actual gates).
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Concurrency: cancel in-progress runs for the same ref on new push (saves Action minutes during
# rapid push cadence). PR runs serialize per-PR.
concurrency:
  group: quality-gates-v2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gates-v2:
    name: Quality Gates (deployment-api)
    uses: IggyIkenna/unified-trading-pm/.github/workflows/python-quality-gates-v2.yml@live-defi-rollout
    with:
      dep_repos: "unified-trading-library unified-api-contracts deployment-service"
      # Empty (the vast majority of repos) -> the reusable workflow's own default -> ubuntu-latest.
      # Non-empty only for repos in scripts/workflow-templates/self-hosted-qg-repos.txt — see
      # unified-trading-pm/.github/workflows/python-quality-gates-v2.yml's own input doc for why this
      # can't be a blanket default (github_actions_operator_gated_followups_2026_07_17.md).
      self_hosted_runner_labels: '["self-hosted","glue"]'
    secrets: inherit
    # Note: reusable workflow inputs are intentionally minimal — service_name + source_dir
    # are derived inside the reusable workflow from github.repository (caller's repo name)
    # and the conventional `<repo>_<underscored>` source-dir layout per workspace SSOT.
    # See `.github/workflows/python-quality-gates-v2.yml` in unified-trading-pm.

  # Escalate a FAILED promotion-gate run to the orchestrator (event-driven LDR-QG-failure escalation).
  # When quality-gates-v2 FAILS on an LDR→staging / LDR→main promotion PR, the deterministic CI/CD
  # pipeline has hit a JUDGMENT wall it cannot fix itself (the promote PR is now red + blocked). Hand
  # it to the agent-orchestrator via the canonical escalate-to-orchestrator.yml reusable workflow
  # (repository_dispatch into PM, which owns that workflow), with wall_type=ldr_qg_failure — the
  # orchestrator already recognises this wall (server/escalation.py WALL_TYPES) and spawns a $0-API
  # setup-token worker that fixes the gate on live-defi-rollout and pings the authoring slot.
  # Best-effort: a notify failure must NEVER fail the build further (the gate already failed). SSOT:
  #   orchestrator_master.md (item P2 "event-driven LDR-QG-failure escalation") +
  #   server/escalation.py + .github/workflows/escalate-to-orchestrator.yml (in unified-trading-pm).
  escalate-ldr-qg-failure:
    name: Escalate LDR-QG failure to orchestrator (promotion PR only)
    needs: quality-gates-v2
    # Fire ONLY when (a) the gate FAILED, (b) this is a pull_request run, and (c) the PR targets a
    # promotion branch (staging or main) — i.e. an LDR→staging / →main promotion gate. A PR into any
    # other base, a push run, or a green gate never escalates. `always()` so the `failure()` of the
    # needed job doesn't also skip THIS job.
    if: >-
      always() && needs.quality-gates-v2.result == 'failure'
      && github.event_name == 'pull_request'
      && (github.base_ref == 'staging' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch escalate-to-orchestrator (ldr_qg_failure → orchestrator worker)
        env:
          # MUST be GH_PAT: a repository_dispatch fired with the default GITHUB_TOKEN does NOT trigger
          # workflows (so escalate-to-orchestrator.yml in PM would never fire). GH_PAT also carries the
          # cross-repo scope needed to dispatch into unified-trading-pm from a service repo.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # `|| true` on the step (and set +e) → a dispatch failure (missing PAT, API hiccup) is logged
        # but never reddens the run; the gate's own failure remains the actionable signal.
        run: |
          set +e
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "[escalate] no GH_PAT — cannot dispatch escalate-to-orchestrator; skipping (gate failure stands)."
            exit 0
          fi
          CTX="quality-gates-v2 FAILED on promotion PR ${REPO}#${PR_NUMBER} (LDR -> ${BASE_REF}). The promote gate is red + the PR is blocked. Fix the gate failure ON live-defi-rollout (re-run the failing quality-gates.sh leg locally, fix root cause, ship via quickmerge), then the promotion re-gates green. Failing run: ${RUN_URL}"
          # repository_dispatch into unified-trading-pm (it owns escalate-to-orchestrator.yml), exactly
          # like the dispatch-cloud-build step targets PM's cloud-build-router. client_payload mirrors
          # the escalate-to-orchestrator inputs (server/models/escalation.py EscalateRequest).
          gh api "repos/${GH_ORG}/unified-trading-pm/dispatches" \
            -f event_type=escalate-to-orchestrator \
            -f "client_payload[repo]=${REPO}" \
            -f "client_payload[pr_number]=${PR_NUMBER}" \
            -f 'client_payload[wall_type]=ldr_qg_failure' \
            -f "client_payload[context]=${CTX}" \
            -f 'client_payload[authoring_slot]=ci' \
            -f 'client_payload[model]=sonnet' \
            && echo "[escalate] dispatched ldr_qg_failure for ${REPO}#${PR_NUMBER} -> orchestrator (via PM escalate-to-orchestrator)." \
            || echo "[escalate] repository_dispatch failed (best-effort) — gate failure stands; check GH_PAT / PM dispatch perms."
          exit 0

  # Dispatch qg-passed to PM cloud-build-router on the MAIN QG run after promotion so Cloud Build
  # runs the release image build. cloud-build-router.yml in PM listens for this event and triggers
  # the GCP Cloud Build pipeline (branch=main → tag {version} / :latest, ENV=prod).
  #
  # FIRES ON push:[main] — NOT staging. A3 (ldr_trunk_promotion_decoupling_2026_06_10) dropped
  # push:[staging] from the trigger surface above, which orphaned the prior `refs/heads/staging`
  # condition (its only firing event was removed) → the image-build dispatch went DEAD fleet-wide
  # (no qg-passed since 2026-06-10; :latest had to be hand-built off-pipeline). The reusable
  # workflow's main push run records MAIN_GREEN AFTER the staging→main promotion merges, so this is
  # the correct + only surviving point to fire the prod image build. SSOT: plan
  # semver_version_bump_skip_ci_promotion_block + ldr_trunk_promotion_decoupling_2026_06_10 A3.
  dispatch-cloud-build:
    name: Dispatch cloud-build trigger (main release)
    needs: quality-gates-v2
    # Skip for a metadata-only commit (version bump or dep pin) OR a docs-only changeset (A1),
    # both fast-pathed by the reusable workflow: no code changed, so no image to rebuild.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.quality-gates-v2.outputs.metadata_only != 'true' && needs.quality-gates-v2.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch qg-passed → cloud-build-router
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Trigger cloud-build-router.yml in unified-trading-pm via repository_dispatch qg-passed
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"qg-passed\", \"client_payload\": {\"repo\": \"${REPO}\", \"branch\": \"${BRANCH}\", \"commit_sha\": \"${COMMIT_SHA}\", \"repo_type\": \"service\"}}"
          echo "Dispatched qg-passed for ${REPO}@${COMMIT_SHA} on ${BRANCH}"

  # Notify ci-health (event-driven path, plan L1555 / L1557). When quality-gates-v2
  # FAILS on any context (push or pull_request), fire a `ci-failure-alert` repository_dispatch
  # into PM so ci-health.yml wakes immediately instead of waiting up to 15 min for
  # the */15 cron. Addresses L1557 as a corollary: the watcher's --auto-recover runs within
  # seconds of a blocked promotion PR rather than on the next cron tick. The cron backstop
  # remains for failures in workflows that do NOT dispatch (backmerge, semver-agent, etc.).
  # Best-effort: a failed dispatch MUST NOT redden the run (gate already failed; cron catches it).
  notify-ci-watcher:
    name: Notify ci-health (event-driven, plan L1555)
    needs: quality-gates-v2
    if: always() && needs.quality-gates-v2.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ci-failure-alert → PM ci-health
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "[notify-ci-watcher] no GH_PAT — skipping event-driven dispatch; cron backstop remains."
            exit 0
          fi
          gh api "repos/${GH_ORG}/unified-trading-pm/dispatches" \
            -f event_type=ci-failure-alert \
            -f "client_payload[repo]=${REPO}" \
            -f "client_payload[branch]=${BRANCH}" \
            -f "client_payload[run_url]=${RUN_URL}" \
            && echo "[notify-ci-watcher] dispatched ci-failure-alert for ${REPO}@${BRANCH} -> PM ci-health." \
            || echo "[notify-ci-watcher] dispatch failed (best-effort); cron backstop remains."
          exit 0
