name: Semver Agent

# Computes the next semver for this repo based on diff analysis since the last released
# baseline, then dispatches a version-bump event to unified-trading-pm with the computed version.
#
# TRIGGER (retargeted 2026-07-25, cicd_mvp_ldr_to_main_pipeline Phase 4): fires on a
# `push` to `main`. In the LDR→main-direct model (staging DORMANT) a commit reaches `main`
# ONLY via the LDR→main promote PR, which already required-checks `quality-gates-v2` before
# merge — so the tree that lands on `main` is already v2-validated and semver need not re-wait
# for a post-merge v2 run. (Previously fired on `branches: [staging]`; the staging drain was
# stopped 2026-06-28 per staging_dormant_mode, so staging never advanced → semver went dead
# fleet-wide → zero tags minted → no wheels published. This retarget is the fix.)
#
# Pipeline position:
#   LDR → [LDR→main promote PR, v2-gated] → main → [this workflow] → compute bump → mint tag → publish
#
# The `semver-agent/label-check` commit status is ADVISORY only (not a required check;
# cicd_mvp Phase 1) — it is posted on the main HEAD for visibility, never to block promotion.
#
# NOTE (major-bump / 1.0.0 graduation): a POST-1.0.0 major bump is NOT auto-dispatched — it
# opens an approval issue and is resolved by a human routing THROUGH staging
# (`quickmerge --to-staging --user-approved`), per the "breaking/major bump routes through
# staging" rule. Only the normal minor/patch (and pre-1.0.0 breaking→MINOR) auto-flow is
# retargeted to main below; the graduation path deliberately still references staging.
#
# Placeholders replaced by the rollout tool (rollout-workflow-templates.sh):
#   git-tag — "git-tag" (mint vX.Y.Z tags) or "pyproject.toml" (legacy commit path)
#                        — substituted from workspace-manifest.json's per-repo version_source.
#   (rollout-semver-agent.sh does NOT substitute git-tag — use
#    rollout-workflow-templates.sh --template semver-agent.yml for git-tag repos.)
# Placeholders (also):
#   deployment-api  — e.g. market-tick-data-service
#   deployment_api — e.g. market_tick_data_service (underscore form)
#
# Pre-1.0.0 semver rules:
#   feat!: / BREAKING CHANGE: → MINOR bump (never auto-cross to 1.0.0)
#   feat:                      → MINOR bump
#   fix:                       → PATCH bump
#   chore:/docs:/etc.          → no bump (skip)
#
# Post-1.0.0 semver rules:
#   feat!: / removed public export → MAJOR bump (opens GitHub Issue for approval, no auto-dispatch)
#   feat: / new public export      → MINOR bump
#   fix: / internal change         → PATCH bump
#
# Dispatch payload to unified-trading-pm:
#   { repo, version, branch, commit_sha, is_breaking }
#
# Secrets required:
#   GH_PAT  — cross-repo dispatch and issue creation

on:
  # Retargeted staging → main (cicd_mvp Phase 4, 2026-07-25). A commit reaches `main`
  # only through the v2-required LDR→main promote PR, so the tree is already validated —
  # no need to re-gate on a post-merge `workflow_run: quality-gates-v2` (that leg was also
  # dead here anyway: with staging dormant, v2 no longer ran on the staging branch). A
  # plain push:[main] fires exactly once per promote-merge, and every commit-SHA ref in
  # the job resolves to `github.sha` (= main HEAD) under the push event.
  push:
    branches: [main]

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}
  SERVICE_NAME: "deployment-api"
  SOURCE_DIR: "deployment_api"
  GH_ORG: ${{ github.repository_owner }}
  # Slack #ci-failures webhook — used by the bump-rate circuit breaker + the
  # version-bump dispatch failure path to page CRITICAL (same channel/pattern as
  # the Notify Slack step below and request-major-bump.yml).
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}

permissions:
  contents: write
  issues: write

jobs:
  semver:
    name: Semver Agent — deployment-api
    runs-on: [self-hosted, glue]
    timeout-minutes: 15
    # push:[main] is implicitly gated: `main` is only updated by a green, v2-required
    # LDR→main promote PR (or an admin reconcile), so the tree is already validated.
    if: github.event_name == 'push'

    steps:
      - name: Checkout repo at main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # codex/ is folded into unified-trading-pm at codex/ — clone it for the
      # readiness checklist when this template is rolled out to a non-PM repo.
      - name: Checkout unified-trading-pm (readiness checklist; codex/ lives inside PM)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GH_ORG }}/unified-trading-pm
          # MUST be a workspace-internal path: actions/checkout@v4 rejects a path that
          # escapes GITHUB_WORKSPACE ("Repository path ... is not under ...") — the
          # `../unified-trading-pm` form failed on EVERY repo's run, jamming staging→main
          # fleet-wide (2026-06-04). A subdir of the main checkout is fine (sparse, transient).
          path: pm-readiness
          token: ${{ secrets.GH_PAT }}
          sparse-checkout: |
            codex/10-audit/

      # ── BUMP-RATE CIRCUIT BREAKER (incident 2026-06-10: instruments-service runaway
      # 0.3.0→0.30.0 at 1 bump/min). A dead baseline freezes the released version → the
      # range-based chore-skip never fires → every QG-green re-bumps forever. A runaway
      # must SELF-HALT, not wait for a human to notice version 0.30.0. "Pending bump" =
      # a `chore(release): bump version to X` commit on main in the last hour (legacy
      # path — a healthy cycle records the baseline before the next; git-tag repos mint a
      # v* TAG instead, counted separately below). ≥3 pending bumps (or ≥3 consecutive at
      # the main tip, clock-skew independent) → REFUSE to compute/dispatch another bump +
      # page CRITICAL + fail the run loudly.
      # Plan: plans/active/issues/semver_version_bump_skip_ci_promotion_block_2026_06_09.md §15.
      - name: Bump-rate circuit breaker (≥3 pending bumps on main)
        run: |
          set -euo pipefail

          # Scan the LIVE main tip, not the (possibly stale) triggering github.sha —
          # during a runaway, newer bump commits land between trigger and execution.
          git fetch origin main --quiet 2>/dev/null || true
          SCAN_REF=$(git rev-parse --verify --quiet origin/main || echo "HEAD")

          RECENT_BUMPS=$(git log --since="1 hour ago" --format=%s "$SCAN_REF" 2>/dev/null \
            | grep -cE '^chore\(release\): bump version to ' || true)
          RECENT_BUMPS="${RECENT_BUMPS:-0}"

          CONSECUTIVE=0
          while IFS= read -r msg; do
            case "$msg" in
              "chore(release): bump version to "*) CONSECUTIVE=$((CONSECUTIVE + 1)) ;;
              *) break ;;
            esac
          done < <(git log -10 --format=%s "$SCAN_REF" 2>/dev/null || true)

          # Adjacent re-bump PAIRS in the last-hour window — a bump commit whose
          # immediately-newer neighbour is ALSO a bump (no content commit between)
          # is the genuine runaway signature (the baseline never recorded, so the
          # bump re-fires on itself). A HEALTHY high-velocity repo bumps ONCE per
          # LDR->main promote — each bump preceded by a real `feat:`/`fix:` promote
          # commit — yielding a strictly-climbing version sequence with ZERO
          # adjacent bump pairs. The */15 promote cadence alone produces up to ~4
          # legitimate bumps/hr, so the pre-2026-06-21 raw `RECENT_BUMPS>=3/hr`
          # count false-tripped on exactly that interleaved climb (incident:
          # deployment-service 0.15->0.16->0.17, 1-consecutive-at-tip, 2026-06-21).
          # SSOT: plans/active/issues/staging_to_main_promotion_starvation_2026_06_19.md.
          REBUMP_PAIRS=0
          PREV_WAS_BUMP=0
          while IFS= read -r msg; do
            case "$msg" in
              "chore(release): bump version to "*)
                [ "$PREV_WAS_BUMP" -eq 1 ] && REBUMP_PAIRS=$((REBUMP_PAIRS + 1))
                PREV_WAS_BUMP=1 ;;
              *) PREV_WAS_BUMP=0 ;;
            esac
          done < <(git log --since="1 hour ago" --format=%s "$SCAN_REF" 2>/dev/null || true)

          # Phase-2 (D13) dynamic repo: with version_source=git-tag the writer mints a TAG, not a
          # `chore(release)` COMMIT, so the commit-based counters above are all 0 → the breaker would
          # go inert and the runaway class re-opens (ordering hazard "breaker goes inert"). Re-derive
          # the rate from `v*` TAG mints in the last hour; the adjacent-pair signature doesn't apply to
          # tags, so the >=6/hr rate backstop carries the runaway protection. Inert for legacy repos.
          VERSION_SOURCE="git-tag"
          if [ "$VERSION_SOURCE" = "git-tag" ]; then
            git fetch origin --tags --quiet 2>/dev/null || true
            NOW_EPOCH=$(date +%s)
            RECENT_BUMPS=$(git for-each-ref --format='%(creatordate:unix)' 'refs/tags/v[0-9]*' 2>/dev/null \
              | awk -v n="$NOW_EPOCH" '($1 != "" && $1 > n - 3600)' | wc -l | tr -d ' ')
            RECENT_BUMPS="${RECENT_BUMPS:-0}"
            echo "Dynamic repo (version_source=git-tag): counted ${RECENT_BUMPS} v* tag mint(s) in the last hour (commit-pair signature N/A)."
          fi

          echo "Pending-bump scan on ${SCAN_REF}: ${RECENT_BUMPS} bump(s)/hr; ${CONSECUTIVE} consecutive at tip; ${REBUMP_PAIRS} adjacent re-bump pair(s)"

          # Trip ONLY on a genuine runaway: >=2 adjacent re-bump pairs (>=3 bumps
          # with no content between, anywhere in the window) OR >=3 consecutive at
          # the tip OR an absurd raw rate (>=6/hr, well above the ~4/hr drain
          # ceiling — a safety backstop even if every bump were content-backed).
          # A content-backed climbing sequence has 0 re-bump pairs => never trips.
          if [ "$REBUMP_PAIRS" -ge 2 ] || [ "$CONSECUTIVE" -ge 3 ] || [ "$RECENT_BUMPS" -ge 6 ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            TEXT=":rotating_light: *CRITICAL — semver-agent BUMP-RATE CIRCUIT BREAKER tripped* | deployment-api | runaway re-bump signature on main: ${REBUMP_PAIRS} adjacent re-bump pair(s) / ${CONSECUTIVE} consecutive at tip / ${RECENT_BUMPS} bump(s)/hr (trip: pairs>=2 OR consecutive>=3 OR rate>=6). A bump with NO content commit between it and the prior bump => the baseline never recorded. For git-tag repos check the latest v* tag vs the manifest versions[deployment-api]; for legacy repos check the PM baseline writer (update-repo-version.yml). REFUSING to dispatch another bump. ${RUN_URL}"
            # Best-effort page on the canonical #ci-failures webhook; the loud signal is
            # the run failure either way (a missing webhook must not mask the halt).
            case "${SLACK_WEBHOOK_URL:-}" in
              https://*)
                curl -s -o /dev/null -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' \
                  --data "$(jq -n --arg t "$TEXT" '{text:$t}')" && echo "CRITICAL page sent to Slack" || true ;;
              *) echo "SLACK_CI_WEBHOOK_URL not set/https — cannot page; failing the run loudly instead" ;;
            esac
            # Queue the page for the end-of-job ledger persist (alert-parity: every Slack
            # page is also observable on the deployment-ui Alerts page) — the persist step
            # runs `if: always()` so this survives the `exit 1` below.
            jq -n -c --arg t "$TEXT" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg ru "$RUN_URL" \
              '{event_type:"slack_alert", timestamp:$ts, repo:"deployment-api", workflow_name:"semver-agent",
                severity:"CRITICAL", conclusion:"", run_url:$ru, message:$t}' \
              >> "$RUNNER_TEMP/semver_alert_ledger.jsonl" || true
            echo "SEMVER_ALERT_EMITTED=1" >> "$GITHUB_ENV"
            echo "::error::Bump-rate circuit breaker: ${REBUMP_PAIRS} adjacent re-bump pair(s) / ${CONSECUTIVE} consecutive at main tip / ${RECENT_BUMPS} bumps/hr (trip: pairs>=2 OR consecutive>=3 OR rate>=6). Refusing to dispatch another bump."
            exit 1
          fi

          echo "Circuit breaker clear — proceeding."

      - name: Compute next semver via diff analysis
        id: compute
        env:
          # Pass the triggering commit message via env — never inline $\{\{ \}\} in run:
          # (a multi-line / quoted commit message would break the shell or inject).
          TRIGGER_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # Phase-2 (D13) flag: "git-tag" → version resolved from v* tags (zero pyproject commits);
          # anything else → legacy pyproject.toml sed path. Substituted at rollout time per repo.
          VERSION_SOURCE="git-tag"

          # ── HEAD-commit re-entry brake (semver_version_bump_skip_ci_promotion_block §15 P1) ──
          # If the commit that triggered this run is ITSELF a semver-agent release bump,
          # the run was fired by our own previous bump → re-bumping on top of it is the
          # runaway re-bump loop. Skip immediately — independent of the bump-rate circuit
          # breaker above (which only CAPS a runaway at ≥3/hr, never prevents it at source).
          # Reuses the existing `skip` output that gates every downstream step.
          FIRST_LINE="${TRIGGER_COMMIT_MSG%%$'\n'*}"
          case "$FIRST_LINE" in
            "chore(release): bump version to "*)
              echo "Re-entry brake: triggering HEAD commit is a release bump ('${FIRST_LINE}') — skipping to prevent the re-bump loop."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "=== Semver Agent: deployment-api ==="
          echo "Triggered by push to main (SHA: ${{ github.sha }})"

          # ── semver_policy check: read from PM manifest ──
          PM_MANIFEST_POLICY=$(gh api "repos/${GH_ORG}/unified-trading-pm/contents/workspace-manifest.json" \
            --jq '.content' | base64 -d 2>/dev/null || echo "")

          SEMVER_POLICY="agent"
          if [ -n "$PM_MANIFEST_POLICY" ]; then
            SEMVER_POLICY=$(echo "$PM_MANIFEST_POLICY" | python3 -c "
          import json, sys
          m = json.load(sys.stdin)
          repos = m.get('repositories', {})
          repo = repos.get('deployment-api', {})
          print(repo.get('semver_policy', 'agent'))
          " 2>/dev/null || echo "agent")
          fi

          echo "semver_policy for deployment-api: $SEMVER_POLICY"

          if [ "$SEMVER_POLICY" = "always_patch" ]; then
            echo "semver_policy=always_patch: skipping label mismatch check, applying patch bump directly."
            CURRENT=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml 2>/dev/null || echo "")
            if [ -z "$CURRENT" ]; then
              echo "No version found in pyproject.toml — skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Version: $CURRENT → $NEW_VERSION (always_patch policy)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "bump_reason=always_patch policy (no label check)" >> "$GITHUB_OUTPUT"
            SHA="${{ github.sha }}"
            OWNER="${{ github.repository_owner }}"
            gh api POST "/repos/${OWNER}/deployment-api/statuses/${SHA}" \
              --field state=success \
              --field context="semver-agent/label-check" \
              --field description="always_patch policy: patch bump applied, label check skipped." || true
            # Baseline-writer SPOF hardening: retry 3× with backoff + CRITICAL page on
            # final failure (mirrors the main dispatch step; incident 2026-06-10).
            HTTP_STATUS=""
            DISPATCH_OK="false"
            for ATTEMPT in 1 2 3; do
              HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
                -d "{\"event_type\": \"version-bump\", \"client_payload\": {\"repo\": \"deployment-api\", \"version\": \"${NEW_VERSION}\", \"branch\": \"main\", \"commit_sha\": \"${SHA}\", \"is_breaking\": \"false\"}}") || HTTP_STATUS="000"
              if [ "$HTTP_STATUS" = "204" ]; then
                DISPATCH_OK="true"
                echo "Dispatched successfully to unified-trading-pm (always_patch, attempt ${ATTEMPT})"
                break
              fi
              echo "WARNING: HTTP ${HTTP_STATUS} dispatching version-bump (always_patch, attempt ${ATTEMPT}/3)"
              cat /tmp/dispatch_response.json 2>/dev/null || true
              [ "$ATTEMPT" -lt 3 ] && sleep $((ATTEMPT * 10))
            done
            if [ "$DISPATCH_OK" != "true" ]; then
              RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              TEXT=":rotating_light: *CRITICAL — semver-agent version-bump dispatch FAILED* | deployment-api v${NEW_VERSION} (always_patch) | dispatch to unified-trading-pm returned HTTP ${HTTP_STATUS} after 3 attempts. The PM versions baseline will NOT record ${NEW_VERSION} → re-bump-loop fuel. Re-dispatch manually + check update-repo-version.yml health. ${RUN_URL}"
              case "${SLACK_WEBHOOK_URL:-}" in
                https://*)
                  curl -s -o /dev/null -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' \
                    --data "$(jq -n --arg t "$TEXT" '{text:$t}')" && echo "CRITICAL page sent to Slack" || true ;;
                *) echo "SLACK_CI_WEBHOOK_URL not set/https — cannot page; failing the run loudly instead" ;;
              esac
              # Queue the page for the end-of-job ledger persist (survives the exit 1).
              jq -n -c --arg t "$TEXT" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg ru "$RUN_URL" \
                '{event_type:"slack_alert", timestamp:$ts, repo:"deployment-api", workflow_name:"semver-agent",
                  severity:"CRITICAL", conclusion:"", run_url:$ru, message:$t}' \
                >> "$RUNNER_TEMP/semver_alert_ledger.jsonl" || true
              echo "SEMVER_ALERT_EMITTED=1" >> "$GITHUB_ENV"
              echo "::error::version-bump dispatch FAILED after 3 attempts (always_patch, last HTTP ${HTTP_STATUS}) — baseline NOT recorded for ${NEW_VERSION}."
              exit 1
            fi
            exit 0
          fi

          # ── Step 1: Determine the last-released baseline version ──
          # git-tag repos: the latest v* TAG is the authoritative last-released version —
          # self-contained, immune to PM-manifest staleness (the dormant staging_versions
          # map is frozen post-cutover; e.g. UTL read 0.43.0 there vs a live 0.56.0 tag,
          # which would have scanned ~13 versions of ancient history → a spurious breaking/
          # minor over-bump, exactly the 2026-06-09 cascade class). Legacy repos: read the
          # stable `versions` map from PM's workspace-manifest.json — the map that
          # update-repo-version.yml writes on the branch=main dispatch this workflow now sends.
          echo ""
          echo "--- Step 1: Reading last-released baseline ---"

          if [ "$VERSION_SOURCE" = "git-tag" ]; then
            git fetch origin --tags --quiet 2>/dev/null || true
            BASELINE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' || echo "")
            [ -z "$BASELINE" ] && BASELINE="0.0.0"
            echo "Baseline (latest git tag) for deployment-api: $BASELINE"
          else
            PM_MANIFEST=$(gh api "repos/${GH_ORG}/unified-trading-pm/contents/workspace-manifest.json" \
              --jq '.content' | base64 -d 2>/dev/null || echo "")
            if [ -n "$PM_MANIFEST" ]; then
              BASELINE=$(echo "$PM_MANIFEST" | python3 -c "
          import json, sys
          m = json.load(sys.stdin)
          versions = m.get('versions', {})
          v = versions.get('deployment-api', '')
          print(v if v else '0.0.0')
          " 2>/dev/null || echo "0.0.0")
            else
              echo "WARNING: Could not fetch PM manifest — defaulting baseline to 0.0.0"
              BASELINE="0.0.0"
            fi
            echo "Baseline (PM versions map) for deployment-api: $BASELINE"
          fi

          # ── Step 2: Determine commit range for diff ──
          echo ""
          echo "--- Step 2: Determining commit range ---"

          if [ "$BASELINE" = "0.0.0" ]; then
            # BASELINE=0.0.0 is USUALLY SPURIOUS, not a genuine first release: the manifest
            # staging_versions entry can read 0.0.0/missing for a repo that HAS released (e.g. a
            # staging merge-sync bumped before the manifest had a baseline — incident 2026-06-09,
            # deployment-api=0.3.0). Scanning ALL history then catches an ancient `feat!:` → BUMP=breaking
            # → spurious fleet-locking cascade (the differ is skipped once BUMP=breaking). So bound the
            # scan the SAME way as the unresolvable-baseline fail-safe below: to the most recent
            # release/version commit reachable from HEAD. Only if NONE exists is this a genuine first
            # release → then all-history is correct (no prior release to bound to; the 0.0.0 first-bump
            # rule governs the version anyway). Closes the 0.0.0-branch gap in the 2026-06-09 bounded-scan fix.
            if [ "$VERSION_SOURCE" = "git-tag" ]; then
              BASELINE_SHA=$(git tag --list 'v*' --sort=-version:refname | head -1 | xargs -I{} git rev-list -n 1 {} 2>/dev/null || echo "")
            else
              BASELINE_SHA=$(git log --oneline | grep -m1 -E "chore\((release|version)\):" | awk '{print $1}' 2>/dev/null || echo "")
            fi
            if [ -n "$BASELINE_SHA" ]; then
              COMMITS=$(git log --oneline "${BASELINE_SHA}..HEAD" 2>/dev/null || echo "")
              echo "BASELINE=0.0.0 but a prior baseline exists ($BASELINE_SHA) → SPURIOUS 0.0.0; BOUNDED scan (fail-safe)"
            else
              COMMITS=$(git log --oneline 2>/dev/null || echo "")
              echo "BASELINE=0.0.0 and no prior baseline → genuine first release; scanning all commits"
            fi
          else
            # Resolve the baseline-version commit ROBUSTLY (incident 2026-06-09): UAC 0.3.0 was set by an
            # admin `chore(version): align ... to 0.3.0` commit, NOT a `bump version to 0.3.0` message, so the
            # message grep MISSED it and fell back to scanning ALL history → an ancient `feat!:` in history
            # flipped BUMP=breaking (the differ is skipped once BUMP=breaking) → a SPURIOUS staging-lock
            # cascade fleet-wide. Fix: pickaxe the authoritative, message-agnostic signal — the
            # `version = "X"` string in pyproject.toml — HEAD-ancestry ONLY (never `--all`, which can match a
            # divergent branch's release commit and poison both the label scan and the differ base). Keep the
            # message grep as a secondary, also HEAD-ancestry.
            if [ "$VERSION_SOURCE" = "git-tag" ]; then
              BASELINE_SHA=$(git rev-list -n 1 "v${BASELINE}" 2>/dev/null || echo "")
            else
              BASELINE_SHA=$(git log -1 --format=%H -S"version = \"${BASELINE}\"" -- pyproject.toml 2>/dev/null || echo "")
              [ -z "$BASELINE_SHA" ] && BASELINE_SHA=$(git log --oneline | grep -m1 "bump version to ${BASELINE}" | awk '{print $1}' 2>/dev/null || echo "")
            fi
            if [ -n "$BASELINE_SHA" ]; then
              COMMITS=$(git log --oneline "${BASELINE_SHA}..HEAD" 2>/dev/null || echo "")
              echo "Scanning commits from $BASELINE_SHA (version $BASELINE) to HEAD"
            else
              # FAIL-SAFE (incident 2026-06-09): baseline commit unresolvable → do NOT scan ALL history (it
              # catches ancient `feat!:` commits → spurious breaking + poisons the differ base). Bound to the
              # most recent release/version commit reachable from HEAD; if none, the last commit only. Erring
              # toward a BOUNDED scan is safe — at worst we under-bump (caught at the next promote), never a
              # spurious fleet-locking breaking verdict off unrelated ancient history.
              BASELINE_SHA=$(git log --oneline | grep -m1 -E "chore\((release|version)\):" | awk '{print $1}' 2>/dev/null || echo "")
              [ -z "$BASELINE_SHA" ] && BASELINE_SHA="HEAD~1"
              COMMITS=$(git log --oneline "${BASELINE_SHA}..HEAD" 2>/dev/null || git log --oneline -1 2>/dev/null || echo "")
              echo "WARNING: baseline $BASELINE commit unresolvable — BOUNDED scan from $BASELINE_SHA to HEAD (fail-safe; was all-history, the 2026-06-09 spurious-cascade bug)"
            fi
          fi

          if [ -z "$COMMITS" ]; then
            echo "No commits to analyze. Nothing to bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Commits to analyze:"
          echo "$COMMITS"

          # ── Step 3: Classify diff using per-repo semver rules ──
          echo ""
          echo "--- Step 3: Classifying diff ---"

          if [ "$VERSION_SOURCE" = "git-tag" ]; then
            CURRENT=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' || echo "")
            if [ -z "$CURRENT" ]; then
              echo "No v* git tag found — using 0.0.0 as initial version"
              CURRENT="0.0.0"
            fi
          else
            CURRENT=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml 2>/dev/null || echo "")
            if [ -z "$CURRENT" ]; then
              echo "No version found in pyproject.toml — skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Current version: $CURRENT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          BUMP=""
          while IFS= read -r msg; do
            if echo "$msg" | grep -qE "^[a-f0-9]+ [a-z]+!(\(.+\))?:"; then
              BUMP="breaking"
              break
            elif echo "$msg" | grep -qE "^[a-f0-9]+ feat(\(.+\))?:"; then
              [ "$BUMP" != "breaking" ] && BUMP="minor"
            elif echo "$msg" | grep -qE "^[a-f0-9]+ fix(\(.+\))?:"; then
              [ "$BUMP" != "breaking" ] && [ "$BUMP" != "minor" ] && BUMP="patch"
            fi
          done <<< "$COMMITS"

          # File-level diff analysis for public API changes
          if [ "$BASELINE" = "0.0.0" ]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              DIFF_BASE="HEAD~1"
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            else
              # First commit in repo — diff against the empty tree
              DIFF_BASE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
            fi
          else
            # Reuse the baseline commit resolved robustly in Step 2 (same run-block scope) — pickaxe on the
            # `version = "X"` pyproject string, HEAD-ancestry, with a bounded fail-safe — instead of the old
            # `git log --all | grep "bump version to ${BASELINE}"` which missed admin-set versions and poisoned
            # the differ base with a cross-branch commit (incident 2026-06-09 spurious-cascade root cause).
            BASELINE_SHA_FOR_DIFF="${BASELINE_SHA:-HEAD~1}"
            DIFF_BASE="${BASELINE_SHA_FOR_DIFF}"
            CHANGED_FILES=$(git diff --name-only "${BASELINE_SHA_FOR_DIFF}..HEAD" 2>/dev/null || echo "")
          fi

          # ── Content-based public-surface breaking detection (SSOT differ) ──
          # Replaces the crude `git diff __init__.py | grep '^-'` text heuristic that
          # flagged ANY removed line (reformatting / import-reordering / docstring edits)
          # as breaking — the false-positive source of spurious cascade locks.
          # The differ (scripts/cicd/detect_breaking_change.py in unified-trading-pm) does an
          # AST diff of the PUBLIC API/schema surface: removed export, removed/renamed symbol,
          # incompatible signature change, removed/renamed/retyped schema field, or removed
          # HTTP route = breaking; added-optional / additive / docstring / reformat = NOT breaking.
          if [ "$BUMP" != "breaking" ]; then
            DIFFER="scripts/cicd/detect_breaking_change.py"
            if [ ! -f "$DIFFER" ]; then
              # Non-PM repos: fetch the SSOT differ from unified-trading-pm at runtime
              gh api "repos/${GH_ORG}/unified-trading-pm/contents/scripts/cicd/detect_breaking_change.py" \
                --jq '.content' 2>/dev/null | base64 -d > /tmp/detect_breaking_change.py \
                && DIFFER="/tmp/detect_breaking_change.py"
            fi
            SURFACE=$(python3 "$DIFFER" --source-dir "${SOURCE_DIR}" --base-ref "$DIFF_BASE" --head-ref HEAD --json 2>/dev/null \
              || echo '{"is_breaking": false, "reasons": ["differ-unavailable"]}')
            echo "Public-surface diff verdict: $SURFACE"
            if echo "$SURFACE" | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('is_breaking') else 1)" 2>/dev/null; then
              echo "Public API/schema surface changed incompatibly → breaking"
              BUMP="breaking"
            elif [ -z "$BUMP" ]; then
              # surface added new exports but no feat:/fix: commit → treat as minor (additive API)
              if echo "$SURFACE" | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('new_export_count',0) > d.get('old_export_count',0) else 1)" 2>/dev/null; then
                BUMP="minor"
              fi
            fi
          fi

          if [ -z "$BUMP" ]; then
            echo "No feat:/fix:/breaking commits or API changes found. Skipping version bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Resolved bump category: $BUMP"

          # ── Label vs API diff mismatch check ──
          SHA="${{ github.sha }}"
          OWNER="${{ github.repository_owner }}"

          # Determine what the commit message signals
          EXPECTED_FROM_LABEL="none"
          # here-string, NOT echo "$COMMITS" | head: a large COMMITS list floods the pipe and
          # head -1 closes it after one line → echo SIGPIPEs → pipefail fails the assignment →
          # set -e aborts step 4 ("Compute next semver"). This was the 2nd fleet-wide jam after
          # the PM-checkout path bug (only surfaced once step 3 stopped failing first). 2026-06-04.
          LATEST_MSG=$(head -1 <<< "$COMMITS")
          if echo "$LATEST_MSG" | grep -qE "^[a-f0-9]+ [a-z]+!(\(.+\))?:" || echo "$LATEST_MSG" | grep -qi "BREAKING CHANGE"; then
            EXPECTED_FROM_LABEL="breaking"
          elif echo "$LATEST_MSG" | grep -qE "^[a-f0-9]+ feat(\(.+\))?:"; then
            EXPECTED_FROM_LABEL="minor"
          elif echo "$LATEST_MSG" | grep -qE "^[a-f0-9]+ fix(\(.+\))?:"; then
            EXPECTED_FROM_LABEL="patch"
          fi

          echo "Expected from commit label: $EXPECTED_FROM_LABEL"
          echo "Resolved from API diff:     $BUMP"

          if [ "$EXPECTED_FROM_LABEL" != "none" ] && [ "$EXPECTED_FROM_LABEL" != "$BUMP" ]; then
            echo "MISMATCH: commit label says $EXPECTED_FROM_LABEL but API diff resolves $BUMP"
            echo "Posting ADVISORY (non-blocking) semver-agent/label-check status on the main HEAD."
            # label-check is ADVISORY only (cicd_mvp Phase 1) — it is NOT a required check, so a
            # failure status here surfaces the mismatch on the main commit for visibility but
            # never blocks promotion (the promote PR already merged on v2+SIT). We still skip the
            # bump on a mismatch so a mislabelled commit does not mint a wrong-magnitude version.
            gh api POST "/repos/${OWNER}/deployment-api/statuses/${SHA}" \
              --field state=failure \
              --field context="semver-agent/label-check" \
              --field description="Label mismatch (advisory): commit says ${EXPECTED_FROM_LABEL}, API diff says ${BUMP}. Fix the commit message on the next change." || true
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Label matches API diff (or label is chore/docs/none — no bump needed): $BUMP bump confirmed."
            gh api POST "/repos/${OWNER}/deployment-api/statuses/${SHA}" \
              --field state=success \
              --field context="semver-agent/label-check" \
              --field description="Label matches API diff: ${BUMP} bump confirmed." || true
          fi

          # ── Step 4: Apply pre-1.0.0 override and compute new version ──
          echo ""
          echo "--- Step 4: Applying semver rules ---"

          BUMP_REASON=""
          case "$BUMP" in
            breaking)
              if [ "$MAJOR" = "0" ]; then
                MINOR=$((MINOR + 1)); PATCH=0
                BUMP_REASON="feat!: on pre-1.0.0 repo (downgraded to MINOR per pre-stable override)"
                echo "Pre-1.0.0 override: breaking → MINOR ($CURRENT → ${MAJOR}.${MINOR}.${PATCH})"
              else
                MAJOR_NEW=$((MAJOR + 1))
                BUMP_REASON="feat!: or removed public export/route (MAJOR required on post-1.0.0 repo)"
                echo "Post-1.0.0 MAJOR bump: $CURRENT → ${MAJOR_NEW}.0.0"
                echo "bump=major_blocked" >> "$GITHUB_OUTPUT"
                echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
                echo "next_version=${MAJOR_NEW}.0.0" >> "$GITHUB_OUTPUT"
                echo "bump_reason=$BUMP_REASON" >> "$GITHUB_OUTPUT"
                echo "skip=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0
              BUMP_REASON="feat: or new public export added" ;;
            patch)
              PATCH=$((PATCH + 1))
              BUMP_REASON="fix: or internal change" ;;
          esac

          # Apply 0.0.0 baseline rule
          if [ "$BASELINE" = "0.0.0" ] && [ "$CURRENT" = "0.0.0" ]; then
            case "$BUMP" in
              breaking|minor) NEW_VERSION="0.1.0" ;;
              patch)          NEW_VERSION="0.0.1" ;;
            esac
            echo "0.0.0 baseline rule: first bump → $NEW_VERSION"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Version: $CURRENT → $NEW_VERSION (bump=$BUMP, reason=$BUMP_REASON)"

          # Track whether this is a breaking change (feat!, removed exports, removed routes)
          IS_BREAKING="false"
          if [ "$BUMP" = "breaking" ]; then
            IS_BREAKING="true"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "bump_reason=$BUMP_REASON" >> "$GITHUB_OUTPUT"
          echo "is_breaking=$IS_BREAKING" >> "$GITHUB_OUTPUT"

      - name: Open GitHub Issue for MAJOR bump approval (post-1.0.0)
        if: steps.compute.outputs.bump == 'major_blocked'
        run: |
          set -euo pipefail

          CURRENT="${{ steps.compute.outputs.current_version }}"
          NEXT="${{ steps.compute.outputs.next_version }}"
          BUMP_REASON="${{ steps.compute.outputs.bump_reason }}"

          echo "Opening MAJOR bump approval issue for deployment-api ($CURRENT → $NEXT)"

          CHECKLIST_FILE="pm-readiness/codex/10-audit/repos/deployment-api.yaml"
          if [ -f "$CHECKLIST_FILE" ]; then
            CHECKLIST_BODY=$(head -80 "$CHECKLIST_FILE")
          else
            CHECKLIST_BODY="Readiness checklist not found at: 10-audit/repos/deployment-api.yaml"
          fi

          ISSUE_BODY="## Major Version Bump Approval Required

          **Repo:** \`deployment-api\`
          **Current version:** \`$CURRENT\`
          **Proposed version:** \`$NEXT\`
          **Reason:** $BUMP_REASON
          **Triggered by:** A commit landing on \`main\` (SHA: \`${{ github.sha }}\`)

          ---

          ## v1.0.0 Readiness Checklist

          A major bump requires ALL of the following gates to be verified before approval (BR8):

          - [ ] **CR5** — Merged to \`main\`, CI green on feature branch
          - [ ] **DR3** — Feature environment deployed, \`/health\` returns 200
          - [ ] **DR4** — Staging SIT passed (system-integration-tests green)
          - [ ] **BR2** — Circuit breaker validated (services only)
          - [ ] **BR3** — UEI events fire correctly
          - [ ] **BR4** — Performance targets met
          - [ ] **BR8** — User explicitly approves this major bump

          ---

          ## Current Readiness State (from unified-trading-pm/codex/10-audit/)

          \`\`\`yaml
          $CHECKLIST_BODY
          \`\`\`

          ---

          ## How to Proceed

          Once ALL checklist items are verified, re-run quickmerge with the \`--user-approved\` flag:

          \`\`\`bash
          bash scripts/quickmerge.sh \"feat!: ...\" --to-staging --user-approved
          \`\`\`

          > **Note:** \`--user-approved\` is NEVER set by \`--agent\` automatically."

          gh issue create \
            --repo "${GH_ORG}/deployment-api" \
            --title "[MAJOR BUMP REQUIRED] deployment-api: $BUMP_REASON" \
            --body "$ISSUE_BODY" \
            --label "major-bump-pending" \
            || echo "WARNING: Issue creation failed (label may not exist) — continuing"

          echo "Issue created. Skipping version-bump dispatch until user approves."

      # ── APPLY the computed version to the repo's OWN pyproject.toml BEFORE dispatching.
      # WHY (root-cause fix 2026-06-06): the retired version-bump.yml committed
      # `chore(release): bump version to X` to pyproject; the semver-agent.yml migration
      # DROPPED that step — it only computed + dispatched. Result: PM recorded the new
      # version in the manifest + fanned out `dep-update/<dep>-<X>` constraint bumps to
      # dependents (">=X"), but the dep repo's pyproject stayed at the OLD version. Because
      # dependents consume the dep via `[tool.uv.sources] path=...` at its PHYSICAL version,
      # ">=X" became UNSATISFIABLE → broken/inconsistent CI installs → dep-update v2 FAILING
      # → dep-order staging→main gate jammed. Committing the version here makes the version
      # the cascade dispatches actually EXIST.
      #
      # NO `[skip ci]` (changed 2026-06-09, plan: semver_version_bump_skip_ci_promotion_block):
      # a `[skip ci]` bump commit produces ZERO check runs, so when it becomes the HEAD of the
      # staging→main promotion PR the required `quality-gates-v2` context is permanently MISSING
      # → the PR is BLOCKED (and the unreleased change re-bumps in a loop: 0.2→0.3→0.4). We let
      # the bump commit trigger quality-gates-v2 normally; the reusable python-quality-gates-v2
      # short-circuits a metadata-only diff to GREEN in seconds (nothing to test), so the required
      # check reports without a wasteful full run. The re-trigger loop is ALREADY prevented by the
      # chore-skip in the compute step (a `chore(release):` commit yields skip=true), so dropping
      # `[skip ci]` is loop-safe.
      - name: Apply version bump (tag mint for git-tag repos, chore(release) for legacy)
        id: apply
        if: steps.compute.outputs.skip != 'true' && steps.compute.outputs.bump != 'major_blocked'
        run: |
          set -euo pipefail

          # Phase-2 (D13): "git-tag" repos mint a vX.Y.Z tag (zero pyproject commits);
          # legacy repos write the version line to pyproject.toml on main.
          VERSION_SOURCE="git-tag"
          NEW_VERSION="${{ steps.compute.outputs.new_version }}"
          CURRENT="${{ steps.compute.outputs.current_version }}"

          if [ -z "$NEW_VERSION" ]; then
            echo "FATAL: empty new_version — cannot apply." >&2
            exit 1
          fi

          if [ "$VERSION_SOURCE" = "git-tag" ]; then
            # Dynamic-versioned repo: mint a vX.Y.Z annotated tag — zero pyproject commits.
            echo "version_source=git-tag — minting tag v${NEW_VERSION} (no pyproject commit)"
            git config user.name "semver-agent[bot]"
            git config user.email "semver-rollout[bot]@users.noreply.github.com"
            if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
              # Existence alone isn't proof this is a genuine re-run: a same-name tag can exist on
              # an unreachable commit (e.g. a manual one-off tagged on the LDR/backmerge side of the
              # promotion boundary, never an ancestor of main's own squash-commit chain — see
              # hatch_vcs_main_tag_ancestry_gap_breaks_cross_repo_pip_install_2026_07_26.md). Treating
              # that as idempotent silently wedges every future mint at the same NEW_VERSION forever.
              if git merge-base --is-ancestor "v${NEW_VERSION}" HEAD 2>/dev/null; then
                echo "Tag v${NEW_VERSION} already exists and is an ancestor of HEAD — idempotent, nothing to do."
                exit 0
              fi
              echo "::error::Tag v${NEW_VERSION} exists but is NOT an ancestor of HEAD — stale/unreachable same-name tag, not a genuine re-run. Refusing to silently no-op or force-move a shared ref (that needs human reconciliation, see hatch_vcs_main_tag_ancestry_gap_breaks_cross_repo_pip_install_2026_07_26.md)." >&2
              exit 1
            fi
            git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}"
            git push origin "v${NEW_VERSION}"
            echo "Tagged + pushed v${NEW_VERSION}"
          else
            # Legacy static-version repo: sed the version line + chore(release) commit to main.
            # (No repo uses this path today — all Python repos are version_source=git-tag — but
            # keep it consistent with the main trigger so it never commits to dormant staging;
            # a re-introduced legacy repo would need the bot to have main-push rights, same as it
            # needed staging-push rights before. The compute-step chore-skip makes the resulting
            # push:[main] re-trigger loop-safe.)
            # Replace the version line in pyproject.toml (anchored to the CURRENT value the
            # compute step read, so we never touch a dependency version line by accident).
            if ! grep -qE "^version = \"${CURRENT}\"" pyproject.toml; then
              echo "FATAL: pyproject.toml version is not '${CURRENT}' (compute baseline) — refusing to sed." >&2
              grep -E "^version = " pyproject.toml || true
              exit 1
            fi
            sed -i "s/^version = \"${CURRENT}\"/version = \"${NEW_VERSION}\"/" pyproject.toml

            if git diff --quiet pyproject.toml; then
              echo "pyproject.toml already at ${NEW_VERSION} — nothing to commit (idempotent)."
              exit 0
            fi

            git config user.name "semver-agent[bot]"
            git config user.email "semver-rollout[bot]@users.noreply.github.com"
            git add pyproject.toml
            git commit -m "chore(release): bump version to ${NEW_VERSION}"

            # Push to main. The job checked out the main head_sha (detached); push the
            # commit explicitly to refs/heads/main. Retry once on a benign non-FF race
            # (another commit landed on main since checkout) by rebasing onto it.
            git fetch origin main --quiet
            if ! git push origin "HEAD:refs/heads/main"; then
              echo "Non-FF push to main — rebasing onto origin/main and retrying once."
              git rebase origin/main
              git push origin "HEAD:refs/heads/main"
            fi
            echo "Committed + pushed chore(release): bump version to ${NEW_VERSION} on main."
          fi

      - name: Dispatch version-bump to unified-trading-pm
        if: steps.compute.outputs.skip != 'true' && steps.compute.outputs.bump != 'major_blocked'
        run: |
          set -euo pipefail

          REPO="deployment-api"
          VERSION="${{ steps.compute.outputs.new_version }}"
          BRANCH="main"
          COMMIT_SHA="${{ github.sha }}"
          OWNER="${{ github.repository_owner }}"

          IS_BREAKING="${{ steps.compute.outputs.is_breaking }}"
          echo "Dispatching version-bump: repo=$REPO version=$VERSION branch=$BRANCH commit_sha=$COMMIT_SHA is_breaking=$IS_BREAKING"

          # Baseline-writer SPOF hardening (incident 2026-06-10): a lost version-bump
          # dispatch freezes the PM versions baseline → fuels the re-bump loop.
          # Retry up to 3× with backoff; on final failure page CRITICAL (the silent
          # single-shot failure was the SPOF). Plan: semver_version_bump_skip_ci_promotion_block §15.
          HTTP_STATUS=""
          DISPATCH_OK="false"
          for ATTEMPT in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
              -d "{\"event_type\": \"version-bump\", \"client_payload\": {\"repo\": \"${REPO}\", \"version\": \"${VERSION}\", \"branch\": \"${BRANCH}\", \"commit_sha\": \"${COMMIT_SHA}\", \"is_breaking\": \"${IS_BREAKING}\"}}") || HTTP_STATUS="000"
            if [ "$HTTP_STATUS" = "204" ]; then
              DISPATCH_OK="true"
              echo "Dispatched successfully to unified-trading-pm (attempt ${ATTEMPT})"
              break
            fi
            echo "WARNING: HTTP ${HTTP_STATUS} dispatching version-bump (attempt ${ATTEMPT}/3)"
            cat /tmp/dispatch_response.json 2>/dev/null || true
            [ "$ATTEMPT" -lt 3 ] && sleep $((ATTEMPT * 10))
          done

          if [ "$DISPATCH_OK" != "true" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            TEXT=":rotating_light: *CRITICAL — semver-agent version-bump dispatch FAILED* | deployment-api v${VERSION} | dispatch to unified-trading-pm returned HTTP ${HTTP_STATUS} after 3 attempts. The PM versions baseline will NOT record ${VERSION} → every future QG-green on main may re-bump (runaway-loop fuel, incident 2026-06-10). Re-dispatch manually + check update-repo-version.yml health. ${RUN_URL}"
            case "${SLACK_WEBHOOK_URL:-}" in
              https://*)
                curl -s -o /dev/null -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' \
                  --data "$(jq -n --arg t "$TEXT" '{text:$t}')" && echo "CRITICAL page sent to Slack" || true ;;
              *) echo "SLACK_CI_WEBHOOK_URL not set/https — cannot page; failing the run loudly instead" ;;
            esac
            # Queue the page for the end-of-job ledger persist (survives the exit 1).
            jq -n -c --arg t "$TEXT" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg ru "$RUN_URL" \
              '{event_type:"slack_alert", timestamp:$ts, repo:"deployment-api", workflow_name:"semver-agent",
                severity:"CRITICAL", conclusion:"", run_url:$ru, message:$t}' \
              >> "$RUNNER_TEMP/semver_alert_ledger.jsonl" || true
            echo "SEMVER_ALERT_EMITTED=1" >> "$GITHUB_ENV"
            echo "::error::version-bump dispatch to unified-trading-pm FAILED after 3 attempts (last HTTP ${HTTP_STATUS}) — baseline NOT recorded for ${VERSION}."
            exit 1
          fi

      - name: Dispatch schema-changed to PM (T0 libraries only)
        if: steps.compute.outputs.skip != 'true' && steps.compute.outputs.bump != 'major_blocked'
        run: |
          set -euo pipefail

          # Only dispatch for T0 library repos whose schema changes affect downstream consumers
          T0_REPOS="unified-api-contracts unified-trading-library"
          if ! echo "$T0_REPOS" | grep -qw "deployment-api"; then
            echo "Not a T0 library repo — skipping schema-changed dispatch"
            exit 0
          fi

          # Check if schema-relevant files changed (exports, models, schemas, types)
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            SCHEMA_FILES=$(git diff HEAD~1 --name-only | grep -E '(__init__|models|schemas|types)\.py$' || true)
          else
            SCHEMA_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '(__init__|models|schemas|types)\.py$' || true)
          fi

          if [ -z "$SCHEMA_FILES" ]; then
            echo "No schema-relevant files changed — skipping schema-changed dispatch"
            exit 0
          fi

          OWNER="${{ github.repository_owner }}"
          VERSION="${{ steps.compute.outputs.new_version }}"
          DIFF_SUMMARY=$(git diff HEAD~1 --stat -- $SCHEMA_FILES | tail -1)

          # Comma-separate changed file list
          CHANGED_LIST=$(echo "$SCHEMA_FILES" | tr '\n' ',' | sed 's/,$//')

          echo "Dispatching schema-changed to PM: deployment-api v${VERSION}"
          echo "  Changed schema files: $CHANGED_LIST"
          echo "  Diff summary: $DIFF_SUMMARY"

          HTTP_STATUS=$(curl -s -o /tmp/schema_dispatch_response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"schema-changed\", \"client_payload\": {\"repo\": \"deployment-api\", \"version\": \"${VERSION}\", \"changed_files\": \"${CHANGED_LIST}\", \"diff_summary\": \"${DIFF_SUMMARY}\"}}")

          if [ "$HTTP_STATUS" = "204" ]; then
            echo "Dispatched schema-changed to unified-trading-pm"
          else
            echo "WARNING: HTTP $HTTP_STATUS dispatching schema-changed (non-fatal)"
            cat /tmp/schema_dispatch_response.json 2>/dev/null || true
          fi

      # ── SLACK NOTIFY (#ci-failures) — FAILURE-ONLY ───────────────────────────
      # A routine SUCCESS post is pure lifecycle noise: semver-agent runs on EVERY main
      # promotion, so a green run carries no signal (operator 2026-06-24 — "don't tell me something
      # succeeded if there was no previous failure"). The genuine semver failure modes (bump-rate
      # circuit-breaker / schema-dispatch failure) already curl their own DETAILED severity:CRITICAL
      # pages above; this failure-only step is the coarse catch-all for any OTHER job failure
      # (version-compute / git push). `if: failure()` removes the success spam at the source.
      - name: Notify Slack (failure-only)
        if: failure()
        env:
          # Retired Telegram -> Slack #ci-failures (cicd #551). Prefer the dedicated valid webhook.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # semver-agent always runs on the main branch. Failure-only (see `if:` above) — STATUS is
          # never `success` here, so the text is unambiguously a failure alert.
          TEXT=":red_circle: *semver-agent FAILED* | deployment-api | ${STATUS} | branch: main (post-promote) — version-bump / schema-dispatch / tag-mint step failed — ${RUN_URL}"
          # Best-effort -- never fail the run on a missing/misconfigured webhook.
          case "${SLACK_WEBHOOK_URL:-}" in
            https://*)
              curl -s -o /dev/null -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' \
                --data "$(jq -n --arg t "$TEXT" '{text:$t}')" && echo "Slack notification sent" || true ;;
            *) echo "SLACK_CI_WEBHOOK_URL not set/https -- skipping notification" ;;
          esac

      # ── ALERT-LEDGER PERSIST (best-effort; alert-parity) ─────────────────────
      # The CRITICAL pages above (bump-rate circuit breaker / dispatch-fail) curl Slack
      # directly because this workflow has no GCP-auth step — so they were the one alert
      # class invisible to the deployment-ui Alerts page. Each page site queues its JSON
      # line in $RUNNER_TEMP and sets SEMVER_ALERT_EMITTED; these `if: always()` steps
      # then persist to the same ledger notify-slack.yml writes. continue-on-error: a
      # missing SA key / bucket outage must NEVER mask the page or change run outcome.
      - name: Authenticate to GCP (alert ledger)
        if: ${{ always() && env.SEMVER_ALERT_EMITTED == '1' && vars.CLOUD_PROVIDER == 'gcp' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Persist CRITICAL pages to alert ledger (best-effort)
        if: ${{ always() && env.SEMVER_ALERT_EMITTED == '1' && vars.CLOUD_PROVIDER == 'gcp' }}
        continue-on-error: true
        env:
          CICD_EVENTS_BUCKET: ${{ vars.CICD_EVENTS_BUCKET || 'unified-trading-cicd-events' }}
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ github.job }}
        run: |
          set -euo pipefail
          LEDGER_FILE="$RUNNER_TEMP/semver_alert_ledger.jsonl"
          [ -s "$LEDGER_FILE" ] || { echo "no queued alerts"; exit 0; }
          DATE_PARTITION=$(date -u +"%Y-%m-%d")
          # ONE OBJECT PER RUN (root-cause fix, not a mitigation — alerts_ledger_race_two_remaining_writers_2026_07_21.md):
          # the OLD path (cp-down -> append -> cp-up onto the shared alerts.jsonl) was an unlocked
          # read-modify-write — any other writer into the same date-partition (notify-slack.yml, or
          # another concurrent semver-agent run) could silently clobber it. deployment-api's reader
          # (_repo_ci_alerts.py::_read_ledgers_sync) already walks the WHOLE cicd/alerts/{date}/
          # prefix and parses every blob it finds — it never assumed a single filename — so writing
          # this run's queued pages straight to their own never-overwritten object eliminates the
          # race with zero reader changes: no read, no local merge, no lock. Matches the pattern
          # already proven in persist-event/action.yml's GCS/S3 event writes.
          UNIQUE_KEY="${RUN_ID}-${JOB_ID}-$(date -u +%s%N)-${RANDOM}"
          OBJECT_PATH="cicd/alerts/${DATE_PARTITION}/${UNIQUE_KEY}.jsonl"
          GCS_URI="gs://${CICD_EVENTS_BUCKET}/${OBJECT_PATH}"
          gsutil cp "$LEDGER_FILE" "$GCS_URI"
          echo "$(wc -l < "$LEDGER_FILE" | tr -d ' ') CRITICAL page(s) persisted to $GCS_URI"
