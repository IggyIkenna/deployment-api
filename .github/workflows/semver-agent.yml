name: Semver Agent

# Thin caller stub (fleet_workflow_template_dedup_to_unified_trading_ci_2026_08_06.md
# todo 5) -- the actual logic now lives in unified-trading-ci as a workflow_call
# reusable workflow. Local trigger config is unavoidable (GitHub Actions requires a
# physical file per repo to declare it), but no job logic lives here anymore.
#
# Do NOT hand-edit the logic here — edit
# unified-trading-ci/.github/workflows/semver-agent.yml and every caller picks it up
# automatically on the next run (pinned @main).

on:
  # Retargeted staging → main (cicd_mvp Phase 4, 2026-07-25). A commit reaches `main`
  # only through the v2-required LDR→main promote PR, so the tree is already validated —
  # no need to re-gate on a post-merge `workflow_run: quality-gates-v2` (that leg was also
  # dead here anyway: with staging dormant, v2 no longer ran on the staging branch). A
  # plain push:[main] fires exactly once per promote-merge, and every commit-SHA ref in
  # the job resolves to `github.sha` (= main HEAD) under the push event.
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

# Serialize per-repo (the LDR→main fleet promote cadence, `*/15`, can fire several
# pushes to main in quick succession). Restored 2026-08-07
# (semver_agent_squash_promote_blind_to_patch_fixes_2026_08_07) — dropped when this
# workflow was retargeted staging→main (2026-07-25) even though the pre-retarget
# staging-triggered version HAD this group; without it, overlapping runs can each read
# a stale `git describe --tags` baseline before the other's tag push lands, racing the
# tag mint. `cancel-in-progress: true` is safe here: every run scans the FULL
# BASELINE..HEAD range cumulatively (not per-commit), so only the latest push's run
# needs to actually complete.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver:
    uses: IggyIkenna/unified-trading-ci/.github/workflows/semver-agent.yml@main
    with:
      repo_name: "deployment-api"
      source_dir: "deployment_api"
      version_source: "git-tag"
    secrets: inherit
