# main-backmerge-to-ldr.yml — auto back-merge `main` → live-defi-rollout
#
# Triggered on every push to `main`. Brings main-only commits (doc-fast-path
# merges, semver-agent version bumps, [skip ci] automation) back into the
# integration branch `live-defi-rollout` so the two never drift apart.
#
# Why this exists (root cause, 2026-06-01): the PM/codex doc-fast-path lands
# commits directly on `main` but nothing back-merged them into LDR. Over a sprint
# `main` and LDR diverged BOTH ways and the LDR→main catch-up PR became a
# ~95-file conflict (PR #103). This workflow closes that hole permanently — it is
# the reverse-direction sibling of `tab-mirror-to-ldr.yml`.
#
# SAFETY CONTRACT (this is the important part):
#   - NEVER force-pushes. It only does a `git merge` (additive, or a `git merge-tree`
#     explicit-base merge when the incoming commit carries a `Promoted-From-LDR:`
#     trailer — see below) then an FF-only push to LDR. It can never overwrite or
#     rewrite a developer's LDR work.
#   - CLEAN merge  → silently merge-pushes into LDR (no PR noise). Rapid tab→LDR
#     development is untouched: this fires only on `main` pushes, which are rare.
#   - CONFLICT     → does NOTHING destructive. It opens (or refreshes) a visible
#     `main → live-defi-rollout` PR for a human to resolve, and notifies the
#     orchestrator. It never auto-resolves a conflict.
#   - RACE (LDR moved mid-merge) → retries FF-only up to 3×; never clobbers.
#   - SILENT-REVERT-LOSS GUARD (2026-07-29): a squash-promote's merge-base can be
#     stale relative to a downstream LDR revert (see the in-body comment at the
#     `Promoted-From-LDR` trailer check) — the explicit-base merge-tree path plus
#     the `check_no_silent_revert_loss` safety net close this; a flagged case is
#     treated as CONFLICT (routes to the human PR, never silently pushed).
#
# Concurrency: keyed on the destination ref so simultaneous back-merges serialize
# (group shared with staging-backmerge-to-ldr so the two never race the same LDR push).
#
# Rollout: `bash unified-trading-pm/scripts/workflow-templates/rollout-workflow-templates.sh --template main-backmerge-to-ldr.yml`
#
# SSOT: this file lives canonically in unified-trading-pm/scripts/workflow-templates/.
# Per-repo copies are flat duplicates; never edit the per-repo copy.

name: main-backmerge-to-ldr

on:
  push:
    branches:
      - main
  # Drift-tick schedule REMOVED 2026-06-27: the hourly safety-net for [skip ci] drift is now
  # handled by PM's branch-health.yml (every 30 min) which dispatches this workflow. For
  # non-PM repos the push trigger covers the common case; LDR drift is acceptable within 30m.
  workflow_dispatch: {}

concurrency:
  group: backmerge-to-ldr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  backmerge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      # Exposed so the notify-failure job below can alert even when the "bm" step itself
      # dies before its own explicit `decision=`/`reason=` write is reached (the silent-
      # failure class this closes — main_backmerge_to_ldr_silent_failure_2026_08_02.md).
      decision: ${{ steps.bm.outputs.decision }}
      reason: ${{ steps.bm.outputs.reason }}
    steps:
      # GitHub App installation token — separate 5000/hr pool from the shared user PAT.
      # Used for `gh pr create` (conflict PR) + the repository_dispatch; an App token CAN
      # open PRs and trigger downstream workflows (the repo-scoped GITHUB_TOKEN cannot).
      # App perms: Contents+PullRequests+Actions R/W; owner: IggyIkenna (fleet-wide).
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_CI_POLLER_APP_ID }}
          private-key: ${{ secrets.GH_APP_CI_POLLER_PRIVATE_KEY }}
          owner: IggyIkenna
      - name: Checkout (full history needed for merge + relationship check)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Back-merge main into LDR (merge-only; conflict → visible PR; never force)
        id: bm
        env:
          # App token (not GITHUB_TOKEN) so `gh pr create` for the conflict PR works: the default
          # GITHUB_TOKEN cannot open PRs when the org/repo disallows Actions-created PRs (the
          # silent "could not open PR — perms" that broke the human-resolution fallback), and an
          # App-created PR triggers its own checks. The LDR `git push` (line ~139) still uses the
          # checkout-persisted GITHUB_TOKEN, so it stays workflow-non-triggering. Draws from the
          # App's separate 5000/hr pool, not the shared user PAT.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_PAT: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail

          # ── Silent-early-death backstop (main_backmerge_to_ldr_silent_failure_2026_08_02.md
          # todo 3) ────────────────────────────────────────────────────────────────────────
          # The confirmed 2026-08-02 incident (missing `|| true` on the grep further below) showed
          # that ANY unguarded command failing before DECISION is ever set aborts this WHOLE script
          # silently under GitHub Actions' implicit `bash -e {0}` run-shell — zero stdout, no
          # decision/reason recorded, and the conflict-PR/escalation path below (which only fires on
          # DECISION=conflict) is never reached because the script died before it could get there.
          # This trap is the generic backstop, not a fix for one specific command: whatever fails
          # next — this step's own `git fetch`/`git ls-remote` calls, or the retry loop's own
          # unguarded `git fetch`/`git checkout -B` further down, or anything a future edit adds —
          # gets DECISION recorded as "error" with the exact failing line/command before the script
          # exits. That lets (a) the "Notify orchestrator" step below (if: always()) report a real
          # decision instead of a blank one, and (b) the dedicated notify-failure job (this file,
          # bottom) actually alert on it via Slack instead of the failure staying invisible beyond a
          # bare workflow red X. Safe to leave unconditional: every command AFTER the real
          # `decision=`/`reason=` write near the end of this script is already inside an `if` test or
          # an `&&`/`||`-guarded chain (verified — none can return non-zero to the trap), so this
          # never double-fires and clobbers a genuinely-determined decision.
          trap '
            _ec=$?
            echo "[backmerge] ERR trap: line=${LINENO} cmd=${BASH_COMMAND} exit=${_ec}"
            { echo "decision=error"; echo "reason=script aborted at line ${LINENO} running: ${BASH_COMMAND} (exit ${_ec})"; } >> "$GITHUB_OUTPUT"
            exit "$_ec"
          ' ERR

          # LDR must exist (some repos use main-only; nothing to back-merge then).
          if ! git ls-remote --exit-code --heads origin live-defi-rollout >/dev/null 2>&1; then
            echo "decision=noop" >> "$GITHUB_OUTPUT"
            echo "reason=no live-defi-rollout branch in this repo" >> "$GITHUB_OUTPUT"
            echo "[backmerge:noop] no LDR branch — nothing to do"
            exit 0
          fi

          git fetch origin main live-defi-rollout --quiet

          # If LDR already contains everything on main, this is a no-op.
          if [ "$(git rev-list origin/live-defi-rollout..origin/main --count)" = "0" ]; then
            echo "decision=noop" >> "$GITHUB_OUTPUT"
            echo "reason=main already contained in LDR" >> "$GITHUB_OUTPUT"
            echo "[backmerge:noop] LDR already contains main HEAD"
            exit 0
          fi

          git config user.name "uts-backmerge-bot"
          git config user.email "uts-backmerge-bot@users.noreply.github.com"

          # ── Silent-revert-loss fix (ldr_main_backmerge_silently_resurrects_reverted_commit_2026_07_29.md) ──
          # Root cause: a squash-promote's commit has ONE parent — main's PREVIOUS tip — never the
          # LDR SHA it actually squashed. If a revert (or any follow-up correction) lands on LDR
          # AFTER that LDR SHA was read but the squash still merges to main, git's own computed
          # merge-base(LDR-tip, squash-commit) resolves to a STALE ancestor that predates BOTH the
          # original fix and its revert — so this 3-way merge reads the revert's own file content as
          # "unchanged since base" and silently re-takes main's (stale, pre-revert) content. No
          # conflict, no marker: `git log` shows the revert, the file content does not reflect it.
          #
          # Fix: `ldr-to-main-promote-fleet.yml` now stamps a `Promoted-From-LDR: <sha>` trailer on
          # every squash-promote commit body — the EXACT LDR SHA that squash represents. When the
          # incoming main commit carries that trailer, use `git merge-tree --write-tree
          # --merge-base=<sha>` (git >=2.38) to force the 3-way merge onto that EXPLICIT, correct
          # base instead of git's own (possibly-stale) computed one. A non-squash merge (e.g. this
          # repo's own PM-only `ldr-to-main-promote.yml`, which uses `--merge` not `--squash`) keeps
          # real ancestry and carries no trailer — it is not vulnerable to this class of bug at all,
          # so the default `git merge` path below is unchanged for it.
          #
          # Oldest-first scan: if multiple promotes landed on main since LDR last back-merged, the
          # EARLIEST trailer is the correct explicit base (the first point staleness could enter).
          TRAILER_SHA=""
          while IFS= read -r _candidate_sha; do
            [ -z "$_candidate_sha" ] && continue
            _msg="$(git log -1 --format=%B "$_candidate_sha" 2>/dev/null || echo "")"
            # `|| true` is load-bearing, not cosmetic: under this script's own `set -o pipefail`
            # (+ the step's `shell: bash -e {0}`), a candidate commit with NO trailer makes `grep`
            # exit 1 (no match) — pipefail propagates that as the pipeline's exit status, and this
            # bare assignment (not inside an if/while condition) then aborts the WHOLE SCRIPT under
            # `-e`, silently, with zero output and no decision/reason recorded (confirmed via local
            # `bash -e` repro — main_ci_red escalation agt-563fa4, 2026-07-31, features-service runs
            # 30608403128/rerun/2nd-rerun, all 3 died here identically). Most candidates in the range
            # WON'T carry the trailer (only squash-promotes do) so this is the common case, not an edge
            # case — `|| true` lets the loop treat "no match" as the expected empty-extraction outcome.
            _extracted="$(printf '%s' "$_msg" | grep -oE '^Promoted-From-LDR: [0-9a-f]{7,40}' | head -1 | awk '{print $2}' || true)"
            if [ -n "$_extracted" ] && git cat-file -e "${_extracted}^{commit}" 2>/dev/null; then
              TRAILER_SHA="$_extracted"
              echo "[backmerge] Promoted-From-LDR trailer found on ${_candidate_sha:0:8}: using ${TRAILER_SHA:0:12} as explicit merge-base"
              break
            fi
          done < <(git log origin/live-defi-rollout..origin/main --reverse --format=%H 2>/dev/null)
          [ -n "$TRAILER_SHA" ] || echo "[backmerge] no Promoted-From-LDR trailer in this range — default git-computed merge-base (unchanged behavior)"

          # ── Candidate-2 safety net (defense-in-depth, not the root fix) ─────────────────────
          # Narrowly scoped to a LOW false-positive signature: did this merge fully discard the
          # effect of LDR's OWN MOST RECENT commit? (i.e. merge-result content for a file the last
          # LDR commit touched exactly equals that commit's PARENT content, not the commit's own
          # content). This is exactly the reported incident's shape (a revert immediately followed
          # by a backmerge that silently undoes it) and catches it independent of whether the
          # trailer fix above even applies (e.g. a genuine main-only revert with no trailer at all).
          # $1=ldr_tip (this iteration's pre-merge LDR HEAD)  $2=result tree-ish (a tree OR commit).
          # Echoes the flagged file list and returns 1 on a hit; silent 0 otherwise.
          check_no_silent_revert_loss() {
            local ldr_tip="$1" result_treeish="$2" ldr_parent changed_files flagged=""
            ldr_parent="$(git rev-parse "${ldr_tip}^" 2>/dev/null)" || return 0
            changed_files="$(git diff --name-only "$ldr_parent" "$ldr_tip" 2>/dev/null)" || return 0
            [ -z "$changed_files" ] && return 0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              local content_result content_parent content_tip
              content_result="$(git show "${result_treeish}:${f}" 2>/dev/null || echo "__MISSING__")"
              content_parent="$(git show "${ldr_parent}:${f}" 2>/dev/null || echo "__MISSING__")"
              content_tip="$(git show "${ldr_tip}:${f}" 2>/dev/null || echo "__MISSING__")"
              if [ "$content_result" = "$content_parent" ] && [ "$content_result" != "$content_tip" ]; then
                flagged="$flagged $f"
              fi
            done <<< "$changed_files"
            if [ -n "$flagged" ]; then
              echo "$flagged"
              return 1
            fi
            return 0
          }

          DECISION="race"
          REASON="LDR kept advancing; exhausted retries"
          for attempt in 1 2 3; do
            git fetch origin live-defi-rollout --quiet
            git checkout -B _backmerge origin/live-defi-rollout --quiet
            LDR_TIP="$(git rev-parse HEAD)"
            MERGE_CONFLICT=false
            SILENT_LOSS_FLAGGED=""

            if [ -n "$TRAILER_SHA" ]; then
              # ── Explicit-base path (Candidate 1 — the root fix) ──────────────────────────
              if MT_OUT="$(git merge-tree --write-tree --merge-base="$TRAILER_SHA" HEAD origin/main 2>&1)"; then
                NEW_TREE="$(printf '%s\n' "$MT_OUT" | head -1)"
                if SILENT_LOSS_FLAGGED="$(check_no_silent_revert_loss "$LDR_TIP" "$NEW_TREE")"; then
                  NEW_COMMIT="$(git commit-tree "$NEW_TREE" -p "$LDR_TIP" -p "$(git rev-parse origin/main)" \
                    -m "Merge remote-tracking branch 'origin/main' into _backmerge")"
                  git reset --hard "$NEW_COMMIT" --quiet
                  echo "[backmerge] explicit-base merge clean (base=${TRAILER_SHA:0:12}) — revert-safety preserved"
                else
                  MERGE_CONFLICT=true
                fi
              else
                echo "[backmerge] explicit-base merge-tree reported a genuine conflict:"
                printf '%s\n' "$MT_OUT"
                MERGE_CONFLICT=true
              fi
            else
              # ── Default path (git-computed merge-base) — UNCHANGED for non-squash promotes ──
              if ! git merge --no-ff --no-edit origin/main; then
                # Guard 2 (cicd_contract_hardening § "Guard 2"): auto-resolve a ci_status-only
                # workspace-manifest.json conflict. ci_status (+ coverage_pct / ci_failure_reason
                # + top-level promotion state) is bot-written on main = the single authoritative
                # home; LDR's copy is non-authoritative and goes stale (tab branches fork an older
                # snapshot then FF-mirror it back), so the recurring textual conflict on those
                # lines must NOT block the back-merge — it transitively dams the LDR→main
                # promotion. The reconciler takes main's CI-automation fields and 3-way-merges
                # everything else; a GENUINE non-CI manifest divergence (exit 2) still falls
                # through to the human PR + orchestrator escalation below. workspace-manifest.json
                # exists only in unified-trading-pm → this is a no-op in every other repo.
                CONFLICTED="$(git diff --name-only --diff-filter=U)"
                if [ "${CONFLICTED}" = "workspace-manifest.json" ] && [ -f scripts/cicd/reconcile_manifest_backmerge.py ]; then
                  MB="$(git merge-base HEAD MERGE_HEAD)"
                  git show "${MB}:workspace-manifest.json" > /tmp/bm_mb.json 2>/dev/null || echo '{}' > /tmp/bm_mb.json
                  git show ":2:workspace-manifest.json" > /tmp/bm_ours.json
                  git show ":3:workspace-manifest.json" > /tmp/bm_theirs.json
                  if python3 scripts/cicd/reconcile_manifest_backmerge.py \
                       --base /tmp/bm_mb.json --ours /tmp/bm_ours.json --theirs /tmp/bm_theirs.json \
                       --out workspace-manifest.json; then
                    git add workspace-manifest.json
                    git commit --no-edit --quiet
                    echo "[backmerge] Guard 2: auto-resolved ci_status-only manifest conflict (main authoritative)"
                    # fall through to the safety-net check below
                  else
                    git merge --abort || true
                    MERGE_CONFLICT=true
                  fi
                else
                  git merge --abort || true
                  MERGE_CONFLICT=true
                fi
              fi
              if [ "$MERGE_CONFLICT" != "true" ]; then
                if ! SILENT_LOSS_FLAGGED="$(check_no_silent_revert_loss "$LDR_TIP" "HEAD")"; then
                  MERGE_CONFLICT=true
                fi
              fi
            fi

            if [ "$MERGE_CONFLICT" = "true" ]; then
              if [ -n "$SILENT_LOSS_FLAGGED" ]; then
                DECISION="conflict"
                REASON="safety-net: merge would silently discard LDR's own last commit's effect on:${SILENT_LOSS_FLAGGED} — human resolution required (no auto-resolve)"
                echo "[backmerge] ⛔ SILENT-REVERT-LOSS SAFETY NET TRIPPED:${SILENT_LOSS_FLAGGED}"
              else
                DECISION="conflict"
                REASON="main and LDR conflict — human resolution required (no auto-resolve)"
              fi
              break
            fi

            # FF-only push (default push is non-destructive on the destination ref).
            if git push origin "HEAD:live-defi-rollout" 2>&1 | tee /tmp/push.log; then
              DECISION="merged"
              REASON="main back-merged into LDR (attempt ${attempt})"
              break
            else
              if grep -q "non-fast-forward\|rejected" /tmp/push.log; then
                echo "[backmerge:race] LDR advanced during merge — retrying (attempt ${attempt})"
                continue
              fi
              # A real push error (auth/etc) — surface it.
              DECISION="error"
              REASON="push failed for a non-race reason (see log)"
              cat /tmp/push.log
              break
            fi
          done

          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "[backmerge:${DECISION}] ${REASON}"

          # On conflict, ensure a VISIBLE main→LDR PR exists so a human can resolve
          # it (mirrors how PR #103 surfaced the original drift). Never auto-resolve.
          if [ "${DECISION}" = "conflict" ]; then
            EXISTING=$(gh pr list --base live-defi-rollout --head main --state open --json number -q '.[0].number' 2>/dev/null || echo "")
            if [ -z "${EXISTING}" ]; then
              gh pr create --base live-defi-rollout --head main \
                --title "[backmerge] main → live-defi-rollout (CONFLICT — needs resolution)" \
                --body "Auto-opened by main-backmerge-to-ldr because main has commit(s) that conflict with LDR. Resolve to keep main and the integration branch from drifting (root cause: doc-fast-path commits to main not back-merged). Do NOT force-push LDR." \
                2>/dev/null && echo "[backmerge] opened conflict PR" || echo "[backmerge] could not open PR (may already exist / perms)"
            else
              echo "[backmerge] conflict PR #${EXISTING} already open"
            fi
            # ALSO escalate to the orchestrator (Max worker) so the conflict is actively resolved on
            # live-defi-rollout, not just parked in a human PR — "every alert → orchestrator" (2026-06-03).
            # Fired with GH_PAT: a repository_dispatch from GITHUB_TOKEN does NOT trigger workflows.
            #
            # MUST target unified-trading-pm, NOT ${GITHUB_REPOSITORY}: the escalate-to-orchestrator.yml
            # LISTENER (repository_dispatch: types: [escalate-to-orchestrator], which actually POSTs
            # /api/escalate) lives ONLY in unified-trading-pm. Every other repo has no such listener, so
            # dispatching to ${GITHUB_REPOSITORY} (this repo) was a SILENT no-op there — GitHub accepts the
            # dispatch (204) with nothing subscribed to receive it, and the unconditional `&&`-echo below
            # then falsely reported "escalated conflict to orchestrator" even though no worker was ever
            # spawned (confirmed 2026-07-22: deployment-ui PR #405 sat conflicting ~2h with
            # /api/escalations/active reporting zero — the human PR was the ONLY real signal). PM's own
            # copy of this file happened to work by coincidence (${GITHUB_REPOSITORY} == unified-trading-pm
            # there); every other repo in the fleet was silently broken since this escalation step was added.
            REPO_NAME="${GITHUB_REPOSITORY##*/}"
            CONFLICT_PR="$(gh pr list --base live-defi-rollout --head main --state open --json number -q '.[0].number' 2>/dev/null || echo 0)"
            GH_TOKEN="${GH_PAT:-}" gh api "repos/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm/dispatches" \
              -f event_type=escalate-to-orchestrator \
              -f "client_payload[repo]=${REPO_NAME}" \
              -f "client_payload[pr_number]=${CONFLICT_PR:-0}" \
              -f 'client_payload[wall_type]=merge_conflict' \
              -f "client_payload[context]=main->live-defi-rollout back-merge conflict: ${REASON}. Resolve on live-defi-rollout (never force-push); quality-gates-v2 re-gates." \
              -f 'client_payload[model]=opus' \
              >/dev/null 2>&1 && echo "[backmerge] escalated conflict to orchestrator (opus worker)" \
              || echo "[backmerge] orchestrator escalation dispatch failed (best-effort; human PR still open)"
          fi

          # A real error (not conflict/race/noop/merged) is the only red-fail case.
          if [ "${DECISION}" = "error" ]; then
            exit 1
          fi
          exit 0

      - name: Notify orchestrator (best-effort; fires on every decision)
        if: always()
        env:
          ORCHESTRATOR_URL: https://api.agent-orchestrator.odum-research.com
          DECISION: ${{ steps.bm.outputs.decision }}
          REASON: ${{ steps.bm.outputs.reason }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          SHA="$(git rev-parse origin/main 2>/dev/null || echo unknown)"
          PAYLOAD=$(cat <<EOF
          {
            "repo": "${REPO}",
            "branch": "main",
            "sha": "${SHA}",
            "decision": "${DECISION:-unknown}",
            "reason": "${REASON:-no reason recorded}",
            "workflow_run_url": "${RUN_URL}",
            "kind": "main-backmerge-to-ldr"
          }
          EOF
          )
          HTTP_CODE=$(curl -sS -o /tmp/notify.body -w "%{http_code}" \
            -X POST "${ORCHESTRATOR_URL}/api/mirror-events" \
            -H "Content-Type: application/json" \
            --connect-timeout 5 --max-time 15 \
            -d "${PAYLOAD}" || echo "000")
          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ]; then
            echo "[backmerge-notify] ok (${HTTP_CODE})"
          else
            echo "[backmerge-notify] non-2xx (${HTTP_CODE}) — best-effort, ignoring"
          fi
          exit 0

      - name: Ping plan-health agent (unified-trading-pm only)
        # On each LDR→main promotion that lands new content on main, trigger the plan-health
        # agent (cross-plan contradiction + governance-doc-drift) on a planning-VM Max-plan slot
        # so the plans stay clean as main↔LDR reconcile. Reuses the BUILT, $0-API endpoint
        # POST /api/plan-health/dispatch (server/plan_health.py + agents/plan-health.md) — the
        # FF main→LDR itself is the deterministic back-merge above. Best-effort — NEVER fails the
        # back-merge. Only PM has plans, so every other repo's copy of this workflow skips it.
        if: github.repository == 'IggyIkenna/unified-trading-pm' && steps.bm.outputs.decision != 'noop'
        env:
          ORCH_URL: https://api.agent-orchestrator.odum-research.com
          ORCH_SECRET: ${{ secrets.ORCHESTRATOR_INTERNAL_SECRET }}
        run: |
          set +e
          if [ -z "${ORCH_SECRET}" ]; then echo "[plan-health] no ORCHESTRATOR_INTERNAL_SECRET — skip"; exit 0; fi
          BODY='{"pm_repo_path":"/home/ubuntu/unified-trading-system-repos/unified-trading-pm","model":"sonnet"}'
          HTTP=$(curl -sS -o /tmp/ph.body -w "%{http_code}" --max-time 30 \
            -X POST "${ORCH_URL}/api/plan-health/dispatch" \
            -H "Content-Type: application/json" -H "X-Orchestrator-Secret: ${ORCH_SECRET}" \
            -d "${BODY}" || echo "000")
          echo "[plan-health] POST /api/plan-health/dispatch -> ${HTTP}"
          [ "${HTTP}" = "200" ] || [ "${HTTP}" = "201" ] || { echo "  body:"; head -c 200 /tmp/ph.body 2>/dev/null; }
          exit 0

  # ── Dedicated failure notifier (main_backmerge_to_ldr_silent_failure_2026_08_02.md todo 3) ──
  # The "Notify orchestrator" step above already posts every decision to /api/mirror-events, but
  # that endpoint's alerting is keyed to tab-mirror-to-ldr.yml's OWN decision vocabulary
  # (`_ALERTED_DECISIONS = {"skip", "race-lost"}` in agent-orchestrator/server/routes/ops.py) — this
  # workflow's decisions (`noop`/`merged`/`conflict`/`race`/`error`) never match, so a real failure
  # here was recorded but never surfaced as an alert even before this incident. Rather than couple
  # this repo's fix to an agent-orchestrator change, post a genuine, independent Slack alert via the
  # fleet's standard reusable carrier (`notify-slack.yml`, the same one branch-health.yml /
  # ci-health.yml use) whenever the backmerge job fails outright OR completes with `decision=error`
  # — the ERR trap in the "bm" step above guarantees the latter is set even for a failure this job
  # never anticipated.
  notify-failure:
    needs: backmerge
    if: always() && (needs.backmerge.result == 'failure' || needs.backmerge.outputs.decision == 'error')
    uses: ./.github/workflows/notify-slack.yml
    with:
      message: |
        :rotating_light: `main-backmerge-to-ldr` failed on `${{ github.repository }}` (run ${{ github.run_id }}).
        Reason: ${{ needs.backmerge.outputs.reason || 'job failed before any decision/reason could be recorded (see run log)' }}
        This is the main→live-defi-rollout sync bridge — left broken, `live-defi-rollout` (every AO slot worker's clone) silently drifts stale behind `main`. Needs human/orchestrator attention, not a routine retry.
      severity: CRITICAL
      conclusion: failure
      workflow_name: main-backmerge-to-ldr
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      dedup_key: main-backmerge-to-ldr:failure
      cooldown_min: 60
      concurrency_suffix: bm-fail
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
