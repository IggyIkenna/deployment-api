name: Quality Gates

on:
  push:
    branches: [main, staging, live-defi-rollout]
  pull_request:
    branches: [main, staging, live-defi-rollout]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    uses: IggyIkenna/unified-trading-pm/.github/workflows/python-quality-gates.yml@live-defi-rollout
    with:
      dep_repos: "unified-api-contracts unified-trading-library"
    secrets: inherit
