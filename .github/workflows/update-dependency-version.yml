name: update-dependency-version

# Thin caller stub (fleet_workflow_template_dedup_to_unified_trading_ci_2026_08_06.md
# todo 4) -- the actual logic now lives in unified-trading-ci as a workflow_call
# reusable workflow. Local trigger config is unavoidable (GitHub Actions requires a
# physical file per repo to declare it), but no job logic lives here anymore.
#
# Do NOT hand-edit the logic here — edit
# unified-trading-ci/.github/workflows/update-dependency-version.yml and every caller picks it up
# automatically on the next run (pinned @main).

on:
  repository_dispatch:
    types: [dependency-update]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-dep:
    uses: IggyIkenna/unified-trading-ci/.github/workflows/update-dependency-version.yml@main
    secrets: inherit
