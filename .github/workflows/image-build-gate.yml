name: image-build-gate

# PR gate: both GCP and AWS images must build before staging→main merges.
# Required status check on PRs targeting main.
# Calls unified-trading-ci-hosted reusable workflow image-build-validate.yml (extracted from
# unified-trading-pm 2026-08-06 so this workflow keeps resolving even if PM's own visibility changes).
# SSOT: codex/05-infrastructure/dual-cloud-image-builds.md

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    uses: IggyIkenna/unified-trading-ci/.github/workflows/image-build-validate.yml@main
    with:
      repo: ${{ github.event.repository.name }}
      commit_sha: ${{ github.event.pull_request.head.sha }}
      branch: ${{ github.head_ref }}
    secrets: inherit
