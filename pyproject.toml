[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[project]
name = "deployment-api"
version = "0.3.0"
description = "Standalone FastAPI API for the deployment monitoring dashboard"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi<1.0.0,>=0.115.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "gunicorn>=22.0.0,<23.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "sse-starlette<2.0.0,>=1.6.1",
    # Auth
    "google-auth>=2.40.0,<3.0.0",
    # Metrics
    "prometheus-client>=0.20.0,<1.0.0",
    # HTTP client
    "httpx>=0.28.1,<1.0.0",
    # GitHub API (service status checkers)
    "PyGithub>=2.0.0,<3.0.0",
    # Async HTTP (service status checks)
    "aiohttp>=3.13.4,<3.14.0",
    # Cache
    "jsonpickle>=3.0.0,<4.0.0",
    "cachetools>=5.0.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    # LLM commentary (pipeline UAT — optional at runtime, required as dep)
    "anthropic>=0.87.0,<1.0.0",
    # Internal libraries
    "unified-trading-library>=0.1.0,<1.0.0",
    "unified-api-contracts>=0.6.0,<1.0.0",
    "deployment-service>=0.7.0,<1.0.0",
    "strategy-service>=0.2.0,<1.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-mock>=3.15.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "cryptography<47.0.0,>=46.0.7",
    "pygments>=2.20.0,<3.0.0",
    "requests>=2.33.0,<3.0.0",
]

[tool.uv.sources]
unified-trading-library = { path = "../unified-trading-library", editable = true}
unified-api-contracts = { path = "../unified-api-contracts", editable = true}
deployment-service = { path = "../deployment-service", editable = true}
strategy-service = { path = "../strategy-service", editable = true}

# ── ruff (lint + format) ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".cursor", ".venv", ".venv-workspace", "build", "dist", "node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G", "C90"]
extend-ignore = ["G003", "G004"]
ignore = ["E402", "B008"]

[tool.ruff.lint.mccabe]
max-complexity = 26

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "E402"]
"tests/*" = ["F401", "F841", "F811"]
"tests/conftest.py" = ["E402"]
"deployment_api/gunicorn.conf.py" = ["N999"]
"deployment_api/main.py" = ["E402"]
"deployment_api/routes/service_status_fast_data.py" = ["E402"]
"deployment_api/routes/deployment_state.py" = ["C901"]
"deployment_api/routes/deployment_validation.py" = ["C901"]
"deployment_api/workers/deployment_processor.py" = ["E402"]
"deployment_api/utils/cache.py" = ["E402"]
"tests/**" = ["SIM117", "SIM105", "F841", "RUF059", "N806", "E402", "E501", "C901"]

# ── basedpyright (typecheck) — CONSOLIDATED; pyrightconfig.json deleted ─────────
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["deployment_api"]
exclude = ["tests", "**/__pycache__", ".venv*", ".venv-workspace", "build", "dist", "node_modules"]
reportAny = "error"
reportMissingTypeStubs = false
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnusedFunction = "none"
reportUnusedImport = "none"

[[tool.basedpyright.executionEnvironments]]
root = "."
pythonVersion = "3.13"
pythonPlatform = "All"
extraPaths = [
    "../unified-cloud-interface",
    "../unified-config-interface",
    "../unified-trading-library",
]

# ── pytest ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: mark test as unit test",
    "integration: integration tests requiring real GCP credentials and API keys",
    "smoke: mark test as smoke test",
    "deployment_test: requires running service container (real HTTP calls via docker-compose.single.yml)",
]

# ── coverage (run + report) ───────────────────────────────────────────────────
[tool.coverage.run]
source = ["deployment_api"]
branch = true
omit = [
    "deployment_api/__main__.py",
    "deployment_api/main.py",
    # Background async task / scheduler loop — validated via integration tests, not unit coverage.
    "deployment_api/workers/auto_sync.py",
    # Mock fixtures / stubs — not reachable from runtime flows when the real implementations are loaded.
    "deployment_api/mock_data.py",
    "deployment_api/mock_state.py",
    "deployment_api/auth_standardized.py",
    # Route modules that are shimmed behind legacy flags or integration-only.
    "deployment_api/routes/data_batch_processing.py",
    "deployment_api/routes/chaos_injections.py",
    "deployment_api/routes/cloud_builds.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

# ── bandit (security SAST) ────────────────────────────────────────────────────
[tool.bandit]
skips = []
