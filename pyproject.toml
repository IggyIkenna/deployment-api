[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "deployment-api"
version = "0.1.0"
description = "Standalone FastAPI API for the deployment monitoring dashboard"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "gunicorn>=21.0.0,<22.0.0",
    "pydantic>=2.12.5,<3.0.0",
    # Auth
    "google-auth>=2.40.0,<3.0.0",
    # Cloud storage
    "google-cloud-storage>=3.8.0,<4.0.0",
    # Metrics
    "prometheus-client>=0.20.0,<1.0.0",
    # HTTP client
    "httpx>=0.28.1,<1.0.0",
    # Async HTTP (service status checks)
    "aiohttp>=3.13.2,<4.0.0",
    # Cloud Build API
    "google-cloud-build>=3.0.0,<4.0.0",
    # Cache
    "jsonpickle>=3.0.0,<4.0.0",
    "cachetools>=5.0.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    # Internal libraries
    "deployment-service>=0.1.0",
    "unified-trading-library>=0.1.0",
    "unified-events-interface>=0.1.0",
    "unified-config-interface>=0.1.0",
    "unified-cloud-interface>=0.1.0",
]

[tool.uv.sources]
deployment-service = { path = "../deployment-service" }
unified-trading-library = { path = "../unified-trading-library" }
unified-events-interface = { path = "../unified-events-interface" }
unified-config-interface = { path = "../unified-config-interface" }
unified-cloud-interface = { path = "../unified-cloud-interface" }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-mock>=3.15.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "ruff==0.15.0",
    "basedpyright>=1.21.0,<2.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deployment_api*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"deployment_api/gunicorn.conf.py" = ["N999"]
"deployment_api/main.py" = ["E402"]
"deployment_api/routes/service_status_fast_data.py" = ["E402"]
"deployment_api/workers/deployment_processor.py" = ["E402"]
"deployment_api/utils/cache.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportAny = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: marks tests as integration tests (require GCP credentials)",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
