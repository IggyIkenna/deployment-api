# Cloud Build for deployment-api
# ARCHITECTURE: Test the artifact you deploy
#   1. Build Docker image
#   2. Run quality gates INSIDE the image
#   3. Push ONLY if tests pass

steps:
  - name: "gcr.io/cloud-builders/gcloud"
    id: "configure-docker"
    args:
      ["auth", "configure-docker", "asia-northeast1-docker.pkg.dev", "--quiet"]
    waitFor: ["-"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "ensure-repo"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe unified-services \
          --location=asia-northeast1 &>/dev/null || \
        gcloud artifacts repositories create unified-services \
          --repository-format=docker --location=asia-northeast1 \
          --description="deployment-api and related services"
    waitFor: ["-"]

  - name: "gcr.io/cloud-builders/docker"
    id: "pull-base"
    args:
      [
        "pull",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-library/unified-trading-library:latest",
      ]
    waitFor: ["configure-docker"]

  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - "build"
      - "--target"
      - "api"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/deployment-api:$SHORT_SHA"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/deployment-api:latest"
      - "."
    waitFor: ["pull-base", "ensure-repo"]

  - name: "gcr.io/cloud-builders/docker"
    id: "build-dev"
    args:
      - "build"
      - "--target"
      - "api-dev"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/deployment-api:dev"
      - "."
    waitFor: ["build"]

  - name: "gcr.io/cloud-builders/docker"
    id: "quality-gates"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        docker run --rm --entrypoint "" \
          -e CLOUD_BUILD=true -e CLOUD_MOCK_MODE=true \
          -e GCP_PROJECT_ID=$PROJECT_ID -e GCP_PROJECT_ID=$PROJECT_ID \
          asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/deployment-api:dev \
          /bin/bash -c "scripts/quality-gates.sh --no-fix --quick" || { echo "❌ Quality gates failed"; exit 1; }
    waitFor: ["build-dev"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      [
        "push",
        "--all-tags",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/deployment-api",
      ]
    waitFor: ["quality-gates"]

  # Step: Vulnerability scan — check for CRITICAL CVEs in pushed image
  - name: "gcr.io/cloud-builders/gcloud"
    id: "scan-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        IMAGE="asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-services/deployment-api:$SHORT_SHA"
        echo "Waiting for Container Analysis vulnerability scan on $IMAGE..."
        for i in $(seq 1 18); do
          RESULT=$(gcloud artifacts docker images describe "$IMAGE" \
            --show-package-vulnerability --format="json" 2>/dev/null)
          if [ -n "$RESULT" ]; then
            CRITICAL=$(echo "$RESULT" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d.get('package_vulnerability_summary',{}).get('vulnerabilities',{}).get('CRITICAL',[])))" 2>/dev/null || echo "0")
            if [ "$CRITICAL" != "0" ]; then
              echo "SCAN FAILED: $CRITICAL CRITICAL CVEs found in $IMAGE"
              exit 1
            fi
            echo "Scan complete: 0 CRITICAL CVEs"
            exit 0
          fi
          echo "Scan not ready (attempt $i/18) — waiting 10s..."
          sleep 10
        done
        echo "WARNING: Scan did not complete in 3 minutes — proceeding"
        exit 0
    waitFor: ["push-image"]

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
timeout: "600s"
