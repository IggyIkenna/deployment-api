# Cloud Build Template — Unified Trading System API Services
#
# API variant: NO pull-base-image (APIs use slimmer base, no UTL dependency).
# Generated from PM template. Placeholders: deployment-api, unified-trading-system.
#
# Required step IDs:
#   - configure-docker, ensure-repo, build, quality-gates, push, scan-check
#
# Add "# deploy-via-dispatch" after title if deploy_via_dispatch: true in manifest.
#
# Variable conventions:
#   deployment-api   — e.g. unified-trading-api or deployment-api
#   unified-trading-system  — e.g. unified-trading-system

substitutions:
  _SERVICE_NAME: "deployment-api"
  _REGISTRY_REPO: "unified-trading-system"
  # Branch the UI-bundling step (fetch-ui) clones deployment-ui at. Cloud Build
  # triggers set BRANCH_NAME automatically; manual `gcloud builds submit` runs
  # pass --substitutions=_BRANCH=<name>. Only deployment-api consumes it.
  _BRANCH: "live-defi-rollout"
  # Deploy gate — the main-deploy trigger sets _DEPLOY=true; every build-only
  # trigger leaves it false so the deploy step (above `images:`) is a no-op.
  _DEPLOY: "false"
  _ROLLUP_JOB: "uts-prod-data-status-rollup" # RETIRED (gen2-only native crash) — kept for ref; deploy syncs _ROLLUP_SVC
  _ROLLUP_SVC: "uts-prod-data-status-rollup-svc" # dedicated gen1/16Gi/scale-to-zero rollup service (R7 follow-up #4)
  # In-image QG toggle — the auto-deploy trigger sets this false (QG already
  # enforced at promotion; the harness isn't in the image). Default true keeps
  # feature-build / LDR behaviour unchanged.
  _RUN_INIMAGE_QG: "true"

steps:
  # ── Fetch deployment-ui (SPA bundle source) — deployment-api ONLY ──────────
  # deployment-api's Dockerfile Stage 0 builds the deployment-ui SPA into ./ui;
  # Cloud Build must populate ./ui before `docker build` or the COPY fails. This
  # step is a guarded NO-OP for every other api-service repo (none bundle a UI),
  # so it is safe in the shared template. Restored 2026-06-14 after a template
  # rollout dropped it (issue: deployment_api_build_broken_fetch_ui_dropped).
  - name: "gcr.io/cloud-builders/gcloud"
    id: "fetch-ui"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        if [ "${_SERVICE_NAME}" != "deployment-api" ]; then
          echo "fetch-ui: ${_SERVICE_NAME} does not bundle a UI — skipping"
          exit 0
        fi
        if [ -f ./ui/package.json ]; then
          echo "ui/ pre-bundled in build context — skipping clone"
          exit 0
        fi
        BRANCH="${_BRANCH:-${BRANCH_NAME:-live-defi-rollout}}"
        echo "Cloning deployment-ui (private) at branch=$$BRANCH (fallback main) into ./ui"
        # deployment-ui is a PRIVATE repo — auth via the GH_PAT secret (the default
        # Cloud Build SA has secretAccessor). Token is passed as an http Basic
        # extraheader (the format GitHub accepts for a PAT) so it never lands in
        # git's URL/log output.
        TOKEN="$$(gcloud secrets versions access latest --secret=GH_PAT)"
        AUTH="$$(printf 'x-access-token:%s' "$$TOKEN" | base64 | tr -d '\n')"
        git -c http.extraheader="AUTHORIZATION: basic $$AUTH" clone --depth 1 \
          --branch "$$BRANCH" https://github.com/IggyIkenna/deployment-ui ./ui \
          || git -c http.extraheader="AUTHORIZATION: basic $$AUTH" clone --depth 1 \
          --branch main https://github.com/IggyIkenna/deployment-ui ./ui
        echo "deployment-ui HEAD: $$(cd ui && git rev-parse --short HEAD)"
    waitFor: ["-"]

  # ── Vendor sibling-repo deps into the build context (trigger path) ──────────
  # The Dockerfile COPYs _unified-api-contracts/ _deployment-service/
  # _strategy-service/ (sibling-repo source pip-installed --no-deps) + the
  # codex-data/pm-plans/pm-configs symlinks. A git-source TRIGGER build (unlike
  # the local deploy-shared.sh rsync) has none of these. Mirror buildspec.aws.yaml:
  # clone each sibling at live-defi-rollout (their integration SSOT) into the
  # _-prefixed dirs, and replace the PM symlinks with empty dirs (the image needs
  # no PM content baked in — data-status reads GCS at runtime). Skipped for any
  # non-deployment-api repo using this shared template.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "vendor-deps"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        if [ "${_SERVICE_NAME}" != "deployment-api" ]; then
          echo "vendor-deps: ${_SERVICE_NAME} has no vendored sibling deps — skipping"
          exit 0
        fi
        TOKEN="$$(gcloud secrets versions access latest --secret=GH_PAT)"
        AUTH="$$(printf 'x-access-token:%s' "$$TOKEN" | base64 | tr -d '\n')"
        clone_dep() {
          repo="$$1"; dest="$$2"
          if [ -d "$$dest" ]; then echo "vendor-deps: $$dest present — skipping"; return 0; fi
          echo "vendor-deps: cloning $$repo @ live-defi-rollout → $$dest"
          git -c http.extraheader="AUTHORIZATION: basic $$AUTH" clone --depth 1 \
            --branch live-defi-rollout "https://github.com/IggyIkenna/$$repo" "$$dest" \
            || git -c http.extraheader="AUTHORIZATION: basic $$AUTH" clone --depth 1 \
            --branch main "https://github.com/IggyIkenna/$$repo" "$$dest"
          rm -rf "$$dest/.git"
          echo "vendor-deps: $$dest $$(du -sh "$$dest" | cut -f1)"
        }
        clone_dep unified-api-contracts _unified-api-contracts
        clone_dep deployment-service   _deployment-service
        clone_dep strategy-service     _strategy-service
        # pm-configs is the operational-config SSOT mirror (unified-trading-pm/configs/):
        # get_config_dir() reads sharding.<service>.yaml from it for the capabilities
        # route (/api/capabilities/service-asset-groups/<service>) and the data-status
        # CLI points --config-dir at it. It MUST be populated in the image, NEVER emptied
        # (emptying 404'd every service-asset-groups lookup). On the trigger path the
        # pm-configs symlink can't be followed, so clone the PM SSOT and copy configs/ in;
        # a local deploy-shared.sh rsync already materialises a real pm-configs (keep it).
        if [ ! -f pm-configs/sharding_config.yaml ]; then
          clone_dep unified-trading-pm _unified-trading-pm
          rm -rf pm-configs && cp -a _unified-trading-pm/configs pm-configs
        fi
        echo "vendor-deps: pm-configs has $$(ls pm-configs/sharding.*.yaml 2>/dev/null | wc -l) sharding configs"
        # codex-data / pm-plans are runtime-GCS-backed — empty placeholders are fine.
        for d in codex-data pm-plans; do
          rm -rf "$$d"; mkdir -p "$$d"; touch "$$d/.gitkeep"
        done
        echo "vendor-deps: done"
    waitFor: ["-"]

  # ── Auth pre-check: fail fast if SA lacks AR access ─
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "auth-precheck"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        TOKEN=$$(gcloud auth print-access-token) || { echo "FAIL: No GCP token"; exit 1; }
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $$TOKEN" "https://asia-northeast1-python.pkg.dev/$PROJECT_ID/unified-libraries/simple/" || echo "000")
        if [ "$$STATUS" != "200" ] && [ "$$STATUS" != "404" ]; then echo "FAIL: Python AR $$STATUS"; exit 1; fi
        gcloud artifacts repositories describe unified-trading-system --location=asia-northeast1 --quiet || { echo "FAIL: Docker AR"; exit 1; }
        echo "Auth pre-check passed"
    waitFor: ["-"]

  # ── STEP 1: Configure Docker authentication ───────────────────────────────
  - name: "gcr.io/cloud-builders/gcloud"
    id: "configure-docker"
    args:
      ["auth", "configure-docker", "asia-northeast1-docker.pkg.dev", "--quiet"]
    waitFor: ["-"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "ensure-repo"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe ${_REGISTRY_REPO} \
          --location=asia-northeast1 &>/dev/null || \
        gcloud artifacts repositories create ${_REGISTRY_REPO} \
          --repository-format=docker \
          --location=asia-northeast1 \
          --description="${_SERVICE_NAME} Docker images"
        gcloud artifacts repositories update ${_REGISTRY_REPO} \
          --location=asia-northeast1 \
          --enable-vulnerability-scanning 2>/dev/null || true
    waitFor: ["-"]

  # ── Pull base image (digest-aware) — required for an authenticated FROM ────
  # When the Dockerfile pins `ARG BASE_IMAGE_DIGEST=sha256:<64-hex>` and its base
  # FROM is the UTL image (deployment-api does), pre-pull THAT digest with the
  # authenticated CLI so the in-build FROM @${...} hits the local cache instead
  # of an UNAUTHENTICATED daemon-side registry pull → "denied" (mtds incident
  # 2026-06-10). Harmless for api repos that don't pin / don't use the UTL base:
  # PIN is empty → only the best-effort `:latest || true` runs.
  - name: "gcr.io/cloud-builders/docker"
    id: "pull-base-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        BASE="asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-library/unified-trading-library"
        PIN=$$(sed -n 's/^ARG BASE_IMAGE_DIGEST=\(sha256:[0-9a-f]\{64\}\).*/\1/p' Dockerfile | head -1 || true)
        if [ -n "$$PIN" ]; then
          echo "pinned base digest: $$PIN — pre-pulling the PINNED manifest"
          docker pull "$${BASE}@$${PIN}"
        fi
        docker pull "$${BASE}:latest" || true
        # Layer-cache seed: pull our OWN previous :latest so the build step's
        # --cache-from can reuse unchanged layers (UI dist, deps) — a small
        # code change then only rebuilds the late COPY+install layers (~10min → ~2-3min).
        # Best-effort: first-ever build / cache miss → || true, full build.
        docker pull "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest" || true
    waitFor: ["configure-docker"]

  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    # BuildKit + inline cache: BUILDKIT_INLINE_CACHE=1 bakes the layer-cache
    # metadata INTO the pushed image so the NEXT build's --cache-from can read it.
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - "build"
      - "-f"
      - "Dockerfile"
      # PROJECT_ID is required by the digest-pinned base FROM in api Dockerfiles
      # (.../unified-trading-library@${BASE_IMAGE_DIGEST}); Cloud Build does NOT
      # auto-pass substitutions as docker build-args, so it must be explicit or
      # the base FROM expands to an invalid reference.
      - "--build-arg"
      - "PROJECT_ID=$PROJECT_ID"
      - "--build-arg"
      - "BUILDKIT_INLINE_CACHE=1"
      - "--build-arg"
      - "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DEPLOYMENT_API=$SHORT_SHA"
      # Reuse unchanged layers from the previous :latest (pulled above).
      - "--cache-from"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest"
      - "."
    waitFor: ["pull-base-image", "ensure-repo", "fetch-ui", "vendor-deps"]

  - name: "gcr.io/cloud-builders/docker"
    id: "quality-gates"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        # The in-image QG re-runs the repo's quality-gates.sh inside the built
        # image. It needs the PM harness (base-service.sh / log_section) + a .git
        # in the image; the auto-deploy path (main-deploy trigger) builds from
        # already-promoted main code whose QG was ALREADY enforced locally at
        # quickmerge + by quality-gates-v2 at the LDR→staging→main PR — so re-running
        # it here is redundant AND impossible (no harness in the image → exit 127).
        # The deploy trigger sets _RUN_INIMAGE_QG=false to skip; feature-build/LDR
        # leave it true (unchanged). Mirrors why cloudbuild-tier3.yaml drops this step.
        if [ "${_RUN_INIMAGE_QG}" != "true" ]; then
          echo "quality-gates: skipped (_RUN_INIMAGE_QG=${_RUN_INIMAGE_QG}) — QG already enforced at promotion"
          exit 0
        fi
        docker run --rm \
          --entrypoint "" \
          -e CLOUD_BUILD=true \
          -e CLOUD_MOCK_MODE=true \
          -e GCP_PROJECT_ID=$PROJECT_ID \
          asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA \
          /bin/bash -c "bash scripts/quality-gates.sh --no-fix --quick"
    waitFor: ["build"]

  # ── STEP 5.5: REQUIRED — Operability smoke (import probe) ───────────────
  # API service — gunicorn entrypoint ≠ --help; import probe verifies the
  # package loads without crashing (credentials-free env).
  - name: "gcr.io/cloud-builders/docker"
    id: "operability-probe"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        IMG="asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
        echo "=== Operability probe: IMPORT deployment_api ==="
        docker run --rm --entrypoint python "$$IMG" \
          -c "import deployment_api; print('IMPORT OK')"
        echo "=== Operability probe PASSED ==="
    waitFor: ["quality-gates"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args:
      [
        "push",
        "--all-tags",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}",
      ]
    waitFor: ["operability-probe"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "scan-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        IMAGE="asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
        echo "Waiting for Container Analysis vulnerability scan on $$IMAGE..."
        for i in $(seq 1 18); do
          RESULT=$(gcloud artifacts docker images describe "$$IMAGE" \
            --show-package-vulnerability --format="json" 2>/dev/null)
          if [ -n "$$RESULT" ]; then
            CRITICAL=$(echo "$$RESULT" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d.get('package_vulnerability_summary',{}).get('vulnerabilities',{}).get('CRITICAL',[])))" 2>/dev/null || echo "0")
            if [ "$$CRITICAL" != "0" ]; then
              echo "SCAN FAILED: $$CRITICAL CRITICAL CVEs found in $$IMAGE"
              exit 1
            fi
            echo "Scan complete: 0 CRITICAL CVEs"
            exit 0
          fi
          echo "Scan not ready (attempt $$i/18) — waiting 10s..."
          sleep 10
        done
        echo "WARNING: Vulnerability scan timed out — proceeding"
        exit 0
    waitFor: ["push"]

  # ── Deploy to Cloud Run (gated: deployment-api + _DEPLOY=true) ──────────────
  # Runs ONLY for the main-deploy trigger (which sets _DEPLOY=true); a guarded
  # NO-OP for the build-only triggers (feat/* / live-defi-rollout, _DEPLOY unset)
  # and for every non-deployment-api repo using this shared template. Rolls the
  # shared `uts-shared-deployment-api` Cloud Run revision to the freshly-built
  # image (a bare --image deploy preserves all existing service config) + syncs
  # the data-status rollup Job to the SAME image so live data-status reflects new
  # code (mirrors deployment-service/scripts/cloud-run/deploy-shared.sh). Operator
  # decision 2026-06-15: auto-deploy deployment-api/ui on main.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        if [ "${_SERVICE_NAME}" != "deployment-api" ] || [ "${_DEPLOY}" != "true" ]; then
          echo "deploy: skipped (_SERVICE_NAME=${_SERVICE_NAME} _DEPLOY=${_DEPLOY})"
          exit 0
        fi
        IMG="asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
        echo "deploy: rolling uts-shared-deployment-api → $$IMG"
        gcloud run deploy uts-shared-deployment-api --image "$$IMG" \
          --region asia-northeast1 --project "$PROJECT_ID" --quiet
        # Sync the DEDICATED data-status rollup SERVICE (gen1, 16Gi, scale-to-zero) to the
        # new image — it runs the rollup compute via POST /api/data-status/rollup-run, hit
        # by the Cloud Scheduler. The standalone Cloud Run JOB (${_ROLLUP_JOB}) is RETIRED:
        # Cloud Run Jobs are gen2-only and the native pyarrow/pandas compute crashes on gen2
        # (R7 follow-up #4); the gen1 service runs it fine. Bare --image preserves the 16Gi /
        # min-scale-0 / max-scale-1 config set at create time.
        if gcloud run services describe "${_ROLLUP_SVC}" --region asia-northeast1 --project "$PROJECT_ID" --format='value(metadata.name)' >/dev/null 2>&1; then
          gcloud run services update "${_ROLLUP_SVC}" --image "$$IMG" --region asia-northeast1 --project "$PROJECT_ID" --quiet
          echo "deploy: rollup service ${_ROLLUP_SVC} synced to new image"
        else
          echo "deploy: rollup service ${_ROLLUP_SVC} not found — skipping rollup-service sync"
        fi
    # waitFor scan-check (NOT push) so we never roll a revision onto an image the
    # vuln scan would reject — deploy is the last gate-passing step before images:.
    waitFor: ["scan-check"]

images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "600s"
