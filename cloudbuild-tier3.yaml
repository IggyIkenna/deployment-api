# Tier-3 fast-path Cloud Build — build + push only (no in-image QG).
#
# Why this exists: the canonical cloudbuild.yaml runs ``quality-gates.sh
# --no-fix --quick`` inside the built image. Useful for prod CI but blocks
# shared-dev tier-3 deploys when test rot exists (9 pre-existing failures
# from the categories→asset_groups rename — tracked separately).
#
# This file is the same build pipeline minus the QG, scan-check, and
# dashboard-push steps. Used only by
# ``unified-trading-pm/scripts/dev/deploy-shared-cloudrun.sh``.
#
# Substitutions:
#   _SERVICE_NAME, _REGISTRY_REPO, _BRANCH, SHORT_SHA — same as cloudbuild.yaml

substitutions:
  _SERVICE_NAME: "deployment-api"
  _REGISTRY_REPO: "unified-trading-system"

steps:
  # ── STEP 1: Configure Docker authentication ───────────────────────────────
  - name: "gcr.io/cloud-builders/gcloud"
    id: "configure-docker"
    args:
      ["auth", "configure-docker", "asia-northeast1-docker.pkg.dev", "--quiet"]
    waitFor: ["-"]

  # ── STEP 2: Ensure AR repo exists ─────────────────────────────────────────
  - name: "gcr.io/cloud-builders/gcloud"
    id: "ensure-repo"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe ${_REGISTRY_REPO} \
          --location=asia-northeast1 &>/dev/null || \
        gcloud artifacts repositories create ${_REGISTRY_REPO} \
          --repository-format=docker \
          --location=asia-northeast1 \
          --description="${_SERVICE_NAME} Docker images"
    waitFor: ["-"]

  # ── STEP 3: deployment-ui short-circuit (pre-bundled by deploy script) ───
  - name: "gcr.io/cloud-builders/git"
    id: "fetch-ui"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ -f ./ui/package.json ]; then
          echo "ui/ pre-bundled in build context — skipping clone"
          exit 0
        fi
        echo "ERROR: ui/ not pre-bundled. Tier-3 script must populate ./ui/" >&2
        exit 1
    waitFor: ["-"]

  # ── STEP 4: Pre-pull UTL base image (auth fix — DIGEST-AWARE) ────────────
  # The Dockerfile pins `ARG BASE_IMAGE_DIGEST=sha256:<64-hex>` and its base FROM
  # is `...@${BASE_IMAGE_DIGEST}`. Pulling only :latest is NOT enough when the pin
  # is a generation behind :latest — the in-build FROM @digest then needs an
  # UNAUTHENTICATED daemon pull → "denied" (2026-06-14). Pre-pull the PINNED
  # manifest so the in-build FROM hits the local cache; also pull :latest.
  - name: "gcr.io/cloud-builders/docker"
    id: "pull-base-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        BASE="asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-library/unified-trading-library"
        PIN=$$(sed -n 's/^ARG BASE_IMAGE_DIGEST=\(sha256:[0-9a-f]\{64\}\).*/\1/p' Dockerfile | head -1 || true)
        if [ -n "$$PIN" ]; then
          echo "pinned base digest: $$PIN — pre-pulling the PINNED manifest"
          docker pull "$${BASE}@$${PIN}"
        fi
        docker pull "$${BASE}:latest" || true
    waitFor: ["configure-docker"]

  # ── STEP 5: Build (target the api stage — skips api-dev / test-in-image) ─
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - "build"
      - "-f"
      - "Dockerfile"
      - "--target"
      - "api"
      - "--build-arg"
      - "PROJECT_ID=$PROJECT_ID"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest"
      - "."
    waitFor: ["configure-docker", "ensure-repo", "fetch-ui", "pull-base-image"]

  # ── STEP 6: Push image (no QG, no scan-check) ────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args:
      [
        "push",
        "--all-tags",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}",
      ]
    waitFor: ["build"]

images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "600s"
